# Faraday IngressRoute
# Access via: https://faraday.knowledgeondemand.net
#
# Auth: Keycloak via OAuth2-Proxy (cookie-based routing)
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: faraday
  namespace: faraday
spec:
  entryPoints:
    - websecure
  routes:
    # OAuth2-Proxy endpoints (sign-in, callback, etc.)
    - match: Host(`faraday.knowledgeondemand.net`) && PathPrefix(`/oauth2/`)
      kind: Rule
      priority: 100
      services:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
    # Authenticated users (have the OAuth2 cookie) → ForwardAuth → backend
    - match: Host(`faraday.knowledgeondemand.net`) && HeadersRegexp(`Cookie`, `_oauth2_proxy=`)
      kind: Rule
      priority: 90
      services:
        - name: faraday
          port: 5985
      middlewares:
        - name: keycloak-forward-auth
          namespace: traefik
        - name: secure-headers
          namespace: traefik
    # Unauthenticated users (no cookie) → redirect to sign-in
    - match: Host(`faraday.knowledgeondemand.net`)
      kind: Rule
      priority: 80
      services:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
      middlewares:
        - name: oauth2-signin-redirect
          namespace: traefik
        - name: secure-headers
          namespace: traefik
  tls: {}
