# Longhorn UI IngressRoute
# Apply AFTER Traefik is fully deployed
#
# Access Longhorn UI at: https://longhorn.knowledgeondemand.net
#
# WARNING: Longhorn UI does not have built-in authentication
# Basic auth middleware is applied for security
#
# TLS: Uses wildcard certificate from default TLSStore
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`longhorn.knowledgeondemand.net`)
      kind: Rule
      services:
        - name: longhorn-frontend
          port: 80
      middlewares:
        - name: basic-auth
          namespace: traefik
        - name: secure-headers
          namespace: traefik
  tls: {}
  # Uses default TLSStore with knowledgeondemand-wildcard-tls certificate
