apiVersion: v1
kind: Namespace
metadata:
  name: openvas
  labels:
    app.kubernetes.io/name: openvas
    app.kubernetes.io/component: vulnerability-scanner
    # OpenVAS requires privileged access for vulnerability scanning
    # (NET_ADMIN, NET_RAW capabilities for network scanning)
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
