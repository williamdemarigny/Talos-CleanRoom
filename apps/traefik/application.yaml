apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  finalizers:
    - argoproj.io/resources-finalizer
  annotations:
    # Deploy after MetalLB and cert-manager
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    targetRevision: 38.0.2
    chart: traefik
    helm:
      valuesObject:
        # Deployment configuration
        deployment:
          enabled: true
          replicas: 2
          annotations: {}
          labels: {}

        # Pod disruption budget
        podDisruptionBudget:
          enabled: true
          minAvailable: 1

        # IngressClass configuration
        ingressClass:
          enabled: true
          isDefaultClass: true

        # Providers configuration
        providers:
          # Enable Kubernetes CRD provider (IngressRoute, Middleware, etc.)
          kubernetesCRD:
            enabled: true
            allowCrossNamespace: true
            allowExternalNameServices: true
          # Enable standard Kubernetes Ingress provider
          kubernetesIngress:
            enabled: true
            allowExternalNameServices: true
            publishedService:
              enabled: true

        # Entrypoints (ports) configuration
        ports:
          # Traefik dashboard (internal only)
          traefik:
            port: 9000
            expose:
              default: false
            exposedPort: 9000
            protocol: TCP

          # HTTP entrypoint
          web:
            port: 8000
            expose:
              default: true
            exposedPort: 80
            protocol: TCP
            # Redirect HTTP to HTTPS
            redirections:
              entryPoint:
                to: websecure
                scheme: https

          # HTTPS entrypoint
          websecure:
            port: 8443
            expose:
              default: true
            exposedPort: 443
            protocol: TCP
            tls:
              enabled: true
            # Enable HTTP/3 (QUIC)
            http3:
              enabled: false

          # Metrics endpoint
          metrics:
            port: 9100
            expose:
              default: false
            exposedPort: 9100
            protocol: TCP

        # Transport timeouts — extend for WebSocket connections (scans run hours)
        additionalArguments:
          - "--entryPoints.websecure.transport.respondingTimeouts.readTimeout=0"
          - "--entryPoints.websecure.transport.respondingTimeouts.writeTimeout=0"
          - "--entryPoints.websecure.transport.respondingTimeouts.idleTimeout=180s"

        # Service configuration
        service:
          enabled: true
          type: LoadBalancer
          annotations:
            metallb.universe.tf/loadBalancerIPs: "10.83.3.200"
          spec: {}

        # TLS configuration
        tlsOptions:
          default:
            minVersion: VersionTLS12
            cipherSuites:
              - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
              - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
              - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
              - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384

        # Default TLS store - use wildcard certificate for all services
        tlsStore:
          default:
            defaultCertificate:
              secretName: knowledgeondemand-wildcard-tls

        # Traefik dashboard
        ingressRoute:
          dashboard:
            enabled: false
            # We'll create a secure IngressRoute separately

        # Logs configuration
        logs:
          general:
            level: INFO
          access:
            enabled: true
            format: json
            fields:
              general:
                defaultmode: keep
              headers:
                defaultmode: drop

        # Resources
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

        # Node selector and tolerations
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
          - key: node-role.kubernetes.io/master
            operator: Exists
            effect: NoSchedule

        # Affinity - prefer running on worker nodes
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values:
                          - traefik
                  topologyKey: kubernetes.io/hostname

        # Cert-manager integration via annotations
        # Certificates will be managed by cert-manager ClusterIssuers

        # Prometheus metrics
        metrics:
          prometheus:
            entryPoint: metrics
            addEntryPointsLabels: true
            addRoutersLabels: true
            addServicesLabels: true

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
