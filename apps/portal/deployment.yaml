# Unified Portal - Deployment
# Lightweight landing page with cross-domain auth code generation
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal
  namespace: portal
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/component: web-portal
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portal
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: security-platform
    spec:
      imagePullSecrets:
      - name: harbor-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: portal
        image: harbor.knowledgeondemand.net/cleanroom/portal:latest
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: portal-credentials
              key: secret-key
        - name: DEPLOYMENT_CONSOLE_URL
          value: "https://10.83.3.190:8000"
        - name: SCANNING_CONSOLE_URL
          value: "https://scan.knowledgeondemand.net"
        ports:
        - containerPort: 8000
          name: http
        volumeMounts:
        - name: credential-vault
          mountPath: /etc/credentials
          readOnly: true
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /api/system/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
        readinessProbe:
          httpGet:
            path: /api/system/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/system/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 5
      volumes:
      - name: credential-vault
        secret:
          secretName: credential-vault
          optional: true
