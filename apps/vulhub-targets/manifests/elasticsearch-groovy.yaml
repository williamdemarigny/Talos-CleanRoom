# Vulhub: Elasticsearch Groovy RCE (CVE-2015-1427)
# Source: https://github.com/vulhub/vulhub/tree/master/elasticsearch/CVE-2015-1427
# Port: 9200 (Elasticsearch HTTP)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticsearch-groovy
  labels:
    app.kubernetes.io/name: elasticsearch-groovy
    app.kubernetes.io/part-of: vulhub-targets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch-groovy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch-groovy
    spec:
      containers:
        - name: elasticsearch
          image: vulhub/elasticsearch:1.4.2
          ports:
            - containerPort: 9200
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch-groovy
  labels:
    app.kubernetes.io/name: elasticsearch-groovy
    app.kubernetes.io/part-of: vulhub-targets
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: elasticsearch-groovy
  ports:
    - port: 9200
      targetPort: 9200
      protocol: TCP
      name: http
