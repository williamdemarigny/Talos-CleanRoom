# Faraday - Vulnerability Management Platform
# Web-based security platform that integrates with Metasploit, Nmap, and 80+ tools
#
# Architecture:
# - PostgreSQL container: Database backend
# - Redis container: Cache and message broker
# - Faraday Server: Web UI and API
#
# Default credentials: faraday / admin (change in production!)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: faraday
  namespace: faraday
  labels:
    app.kubernetes.io/name: faraday
    app.kubernetes.io/component: security-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: faraday
  template:
    metadata:
      labels:
        app.kubernetes.io/name: faraday
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: security-platform
    spec:
      # ============================================================
      # INIT CONTAINERS
      # ============================================================
      initContainers:
      - name: init-postgres
        image: postgres:17-alpine
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "Setting up PostgreSQL data directory..."
            if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
              echo "Initializing PostgreSQL database..."
              chown -R postgres:postgres /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data
            else
              echo "PostgreSQL data directory already initialized."
            fi
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        securityContext:
          runAsUser: 0
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"

      - name: init-faraday-config
        image: busybox:1.37
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "Setting up Faraday config directory..."
            mkdir -p /home/faraday/.faraday/config
            mkdir -p /home/faraday/.faraday/storage
            mkdir -p /home/faraday/.faraday/logs
            mkdir -p /home/faraday/.faraday/session
            # Copy ConfigMap server.ini to writable volume (if not exists or force refresh)
            cp /config-source/server.ini /home/faraday/.faraday/config/server.ini
            chmod 644 /home/faraday/.faraday/config/server.ini
            echo "Faraday config initialized."
        volumeMounts:
        - name: faraday-data
          mountPath: /home/faraday/.faraday
        - name: faraday-config
          mountPath: /config-source
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "100m"

      # ============================================================
      # MAIN CONTAINERS
      # ============================================================
      containers:
      # 1. PostgreSQL Database
      - name: postgres
        image: postgres:17-alpine
        env:
        - name: POSTGRES_USER
          value: "faraday"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: faraday-credentials
              key: postgres-password
        - name: POSTGRES_DB
          value: "faraday"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        ports:
        - containerPort: 5432
          name: postgres
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "faraday", "-d", "faraday"]
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "faraday", "-d", "faraday"]
          initialDelaySeconds: 30
          periodSeconds: 30

      # 2. Redis Cache
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 10

      # 3. Faraday Server
      - name: faraday
        image: faradaysec/faraday:5.8.0
        command: ["/bin/bash", "-c"]
        args:
          - |
            echo "Waiting for PostgreSQL on port 5432..."
            while ! (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null; do
              echo "PostgreSQL not ready, waiting..."
              sleep 2
            done
            echo "PostgreSQL ready."

            echo "Waiting for Redis on port 6379..."
            while ! (echo > /dev/tcp/127.0.0.1/6379) 2>/dev/null; do
              echo "Redis not ready, waiting..."
              sleep 2
            done
            echo "Redis ready."

            # Create required directories
            mkdir -p /home/faraday/.faraday/storage
            mkdir -p /home/faraday/.faraday/logs
            mkdir -p /home/faraday/.faraday/session

            # Initialize database tables (idempotent - safe to run multiple times)
            echo "Creating database tables..."
            faraday-manage create-tables || echo "Tables may already exist"

            # Create admin user if not exists (password from environment variable)
            echo "Creating admin user..."
            faraday-manage create-superuser --username faraday --password "${ADMIN_PASSWORD}" --email admin@localhost 2>/dev/null || echo "User may already exist"

            # Run migrations
            echo "Running migrations..."
            faraday-manage migrate

            # Start Faraday server
            echo "Starting Faraday server..."
            exec faraday-server --bind 0.0.0.0
        env:
        - name: PGSQL_HOST
          value: "127.0.0.1"
        - name: PGSQL_PORT
          value: "5432"
        - name: PGSQL_USER
          value: "faraday"
        - name: PGSQL_PASSWD
          valueFrom:
            secretKeyRef:
              name: faraday-credentials
              key: postgres-password
        - name: PGSQL_DBNAME
          value: "faraday"
        - name: REDIS_SERVER
          value: "redis://127.0.0.1:6379"
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: faraday-credentials
              key: admin-password
        volumeMounts:
        - name: faraday-data
          mountPath: /home/faraday/.faraday
        ports:
        - containerPort: 5985
          name: http
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1"
        startupProbe:
          tcpSocket:
            port: 5985
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: 5985
          initialDelaySeconds: 90
          periodSeconds: 10
          failureThreshold: 15
        livenessProbe:
          tcpSocket:
            port: 5985
          initialDelaySeconds: 180
          periodSeconds: 30
          failureThreshold: 10

      # ============================================================
      # VOLUMES
      # ============================================================
      volumes:
      - name: faraday-data
        persistentVolumeClaim:
          claimName: faraday-data
      - name: postgres-data
        persistentVolumeClaim:
          claimName: faraday-db
      - name: faraday-config
        configMap:
          name: faraday-server-config
---
# Faraday server.ini configuration
# Note: Database password is injected via PGSQL_PASSWD environment variable
# The connection_string here uses a placeholder that Faraday overrides with env vars
apiVersion: v1
kind: ConfigMap
metadata:
  name: faraday-server-config
  namespace: faraday
  labels:
    app.kubernetes.io/name: faraday
    app.kubernetes.io/component: config
data:
  server.ini: |
    [database]
    # Connection string is overridden by PGSQL_* environment variables
    connection_string = postgresql+psycopg2://faraday@127.0.0.1/faraday

    [faraday_server]
    bind_address = 0.0.0.0
    port = 5985
    websocket_port = 9000
    secret_key = changeme_in_production

    [storage]
    path = /home/faraday/.faraday/storage

    [logger]
    level = INFO
# =============================================================================
# SECRETS - Managed externally via SOPS encryption
# =============================================================================
# The secrets referenced by this deployment are stored in:
#   secrets.sops.yaml (SOPS-encrypted)
#
# To generate new secrets:
#   ../../../scripts/generate-secrets.sh
#
# To apply secrets (decrypts and applies):
#   sops -d secrets.sops.yaml | kubectl apply -f -
#
# Required secrets:
#   - faraday-credentials: (keys: postgres-password, admin-password)
# =============================================================================
