# Harbor IngressRoute
# Access via: https://harbor.knowledgeondemand.net
#
# TLS: Uses wildcard certificate from default TLSStore
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: harbor
  namespace: harbor
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`harbor.knowledgeondemand.net`)
      kind: Rule
      services:
        - name: harbor
          port: 80
      middlewares:
        - name: secure-headers
          namespace: traefik
  tls: {}
  # Uses default TLSStore with knowledgeondemand-wildcard-tls certificate
