# CleanRoom Database - Secrets
# =============================================================================
# IMPORTANT: This file should be SOPS-encrypted before committing.
#
# To encrypt:
#   sops -e -i secrets.yaml
#   mv secrets.yaml secrets.sops.yaml
#
# To decrypt and apply:
#   sops -d secrets.sops.yaml | kubectl apply -f -
#
# Required by: cleanroom-db StatefulSet, scanning-console Deployment
# =============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: cleanroom-db-credentials
  namespace: cleanroom-db
  labels:
    app.kubernetes.io/name: cleanroom-db
    app.kubernetes.io/component: database
type: Opaque
stringData:
  postgres-password: "CHANGE_ME_BEFORE_ENCRYPTING"
