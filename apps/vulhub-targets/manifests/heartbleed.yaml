# Vulhub: Heartbleed (CVE-2014-0160) — OpenSSL TLS information leak
# Source: https://github.com/vulhub/vulhub/tree/master/openssl/CVE-2014-0160
# Port: 8443 (Nginx with vulnerable OpenSSL)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartbleed
  labels:
    app.kubernetes.io/name: heartbleed
    app.kubernetes.io/part-of: vulhub-targets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: heartbleed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heartbleed
    spec:
      containers:
        - name: nginx
          image: vulhub/openssl:1.0.1f-nginx
          ports:
            - containerPort: 8443
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: heartbleed
  labels:
    app.kubernetes.io/name: heartbleed
    app.kubernetes.io/part-of: vulhub-targets
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: heartbleed
  ports:
    - port: 8443
      targetPort: 8443
      protocol: TCP
      name: https
