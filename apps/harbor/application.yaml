apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  finalizers:
    - argoproj.io/resources-finalizer
  annotations:
    # Deploy after Traefik and cert-manager are ready
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    # Harbor Helm chart
    - repoURL: https://helm.goharbor.io
      targetRevision: 1.16.2
      chart: harbor
      helm:
        valuesObject:
          externalURL: https://harbor.knowledgeondemand.net

          # Disable built-in ingress — we use Traefik IngressRoute instead
          expose:
            type: clusterIP
            tls:
              enabled: false

          # Internal TLS between components (not needed in single-cluster)
          internalTLS:
            enabled: false

          # PostgreSQL (internal, managed by Harbor chart)
          database:
            type: internal

          # Persistent storage via Ceph RBD
          persistence:
            enabled: true
            persistentVolumeClaim:
              registry:
                storageClass: ceph-rbd
                size: 50Gi
              database:
                storageClass: ceph-rbd
                size: 10Gi
              redis:
                storageClass: ceph-rbd
                size: 2Gi
              trivy:
                storageClass: ceph-rbd
                size: 5Gi
              jobservice:
                jobLog:
                  storageClass: ceph-rbd
                  size: 2Gi

          # Trivy vulnerability scanner
          trivy:
            enabled: true
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1
                memory: 1Gi

          # Notary (image signing) — disabled
          notary:
            enabled: false

          # Chart Museum — disabled
          chartmuseum:
            enabled: false

          # Component resource limits
          core:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1
                memory: 1Gi
          portal:
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
          registry:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1
                memory: 1Gi
          jobservice:
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 512Mi

    # IngressRoute and namespace from git repo
    - repoURL: git@github.com:williamdemarigny/Talos-CleanRoom.git
      targetRevision: main
      path: apps/harbor
      directory:
        recurse: false
        exclude: 'application.yaml'
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
