# Vulhub: MySQL Auth Bypass (CVE-2012-2122)
# Source: https://github.com/vulhub/vulhub/tree/master/mysql/CVE-2012-2122
# Port: 3306 (MySQL)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-auth-bypass
  labels:
    app.kubernetes.io/name: mysql-auth-bypass
    app.kubernetes.io/part-of: vulhub-targets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mysql-auth-bypass
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mysql-auth-bypass
    spec:
      containers:
        - name: mysql
          image: vulhub/mysql:5.5.23
          ports:
            - containerPort: 3306
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-auth-bypass
  labels:
    app.kubernetes.io/name: mysql-auth-bypass
    app.kubernetes.io/part-of: vulhub-targets
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mysql-auth-bypass
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
      name: mysql
