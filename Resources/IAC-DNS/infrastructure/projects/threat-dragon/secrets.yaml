# Threat Dragon Secrets
# =============================================================================
# WARNING: DEFAULT VALUES - CHANGE BEFORE PRODUCTION USE!
# =============================================================================
# Generate new values with: openssl rand -hex 16
# Or use: python -c "import secrets; print(secrets.token_hex(16))"
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: threat-dragon-secrets
  namespace: threat-dragon
type: Opaque
stringData:
  # Encryption key for sessions (32 hex chars = 16 bytes)
  encryption-keys: "0123456789abcdef0123456789abcdef"
  # JWT signing key (32 hex chars = 16 bytes)
  jwt-signing-key: "fedcba9876543210fedcba9876543210"
  # JWT refresh signing key (32 hex chars = 16 bytes)
  jwt-refresh-signing-key: "abcdef0123456789abcdef0123456789"
