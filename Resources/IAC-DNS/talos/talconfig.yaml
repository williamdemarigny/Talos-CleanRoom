talosVersion: v1.11.0
kubernetesVersion: v1.33.3
# Cluster configuration
clusterName: proxmox-CleanRoom-cluster
endpoint: https://${CONTROL_PLANE_ENDPOINT_FQDN}:6443
clusterPodNets:
- 10.14.0.0/16
clusterSvcNets:
- 10.15.0.0/16
# NOTE: Using pre-built Image Factory schematics, so dynamic schematic customization is removed.
# Node schematic ID: ddf38e55e30aa9b2bb0b765054ed63444dc00244ab8bb4ad4ad92486602285f8

nodes:
# Control plane node (from Terraform)
- hostname: ${TALOS_CONTROL_PLANE_NAME_0}
  controlPlane: true
  ipAddress: ${TALOS_CONTROL_PLANE_FQDN_0}
  installDisk: /dev/vda
  networkInterfaces:
  - deviceSelector:
      hardwareAddr: "${TALOS_CONTROL_PLANE_MAC_0}"
    dhcp: true
  certSANs:
    - ${TALOS_CONTROL_PLANE_NAME_0}
    - ${TALOS_CONTROL_PLANE_FQDN_0}

# Worker nodes (from Terraform)
- hostname: ${TALOS_WORKER_NAME_1}
  controlPlane: false
  ipAddress: ${TALOS_WORKER_FQDN_1}
  installDisk: /dev/vda
  networkInterfaces:
  - deviceSelector:
      hardwareAddr: "${TALOS_WORKER_MAC_1}"
    dhcp: true
  nodeLabels:
    node-type: worker
  certSANs:
    - ${TALOS_WORKER_NAME_1}
    - ${TALOS_WORKER_FQDN_1}

- hostname: ${TALOS_WORKER_NAME_2}
  controlPlane: false
  ipAddress: ${TALOS_WORKER_FQDN_2}
  installDisk: /dev/vda
  networkInterfaces:
  - deviceSelector:
      hardwareAddr: "${TALOS_WORKER_MAC_2}"
    dhcp: true
  nodeLabels:
    node-type: worker
  certSANs:
    - ${TALOS_WORKER_NAME_2}
    - ${TALOS_WORKER_FQDN_2}

- hostname: ${TALOS_WORKER_NAME_3}
  controlPlane: false
  ipAddress: ${TALOS_WORKER_FQDN_3}
  installDisk: /dev/vda
  networkInterfaces:
  - deviceSelector:
      hardwareAddr: "${TALOS_WORKER_MAC_3}"
    dhcp: true
  nodeLabels:
    node-type: worker
  certSANs:
    - ${TALOS_WORKER_NAME_3}
    - ${TALOS_WORKER_FQDN_3}    

# Global patches
patches:
# Network configuration
- |-
  machine:
    network:
      nameservers:
        - 1.1.1.1
        - 1.0.0.1
# Time configuration
- |-
  machine:
    time:
      disabled: false
      servers:
        - time.cloudflare.com
# Common kernel modules and sysctls
- |-
  machine:
    sysctls:
      vm.nr_hugepages: "1024"
      net.core.bpf_jit_harden: 1
    kernel:
      modules:
        - name: nvme_tcp
        - name: vfio_pci
        - name: uio_pci_generic
# Control plane specific configuration
controlPlane:
  patches:
  # Default containerd runtime for control plane nodes
  - |-
    machine:
      files:
        - path: /etc/cri/conf.d/20-customization.part
          op: create
          content: |
            [plugins]
              [plugins."io.containerd.cri.v1.runtime"]
                [plugins."io.containerd.cri.v1.runtime".containerd]
                  default_runtime_name = "runc"
  # Machine certificate SANs (allows connection via both shortname and FQDN)
  - |-
    machine:
      certSANs:
        - ${TALOS_CONTROL_PLANE_NAME_0}
        - ${TALOS_CONTROL_PLANE_FQDN_0}
  # Cluster configuration
  - |-
    cluster:
      controllerManager:
        extraArgs:
          bind-address: 0.0.0.0
      scheduler:
        extraArgs:
          bind-address: 0.0.0.0
  # Node labels for control plane nodes that should not be load balancers
  - |-
    machine:
      nodeLabels:
        node.kubernetes.io/exclude-from-external-load-balancers: ""
  # Explicitly pin control plane image to the one used in the installer schematic
  - |-
    machine:
      install:
        image: factory.talos.dev/metal-installer/ddf38e55e30aa9b2bb0b765054ed63444dc00244ab8bb4ad4ad92486602285f8:v1.11.0
# Worker specific configuration
worker:
  patches:
  # Pin worker install image to match control plane schematic
  - |-
    machine:
      install:
        image: factory.talos.dev/metal-installer/ddf38e55e30aa9b2bb0b765054ed63444dc00244ab8bb4ad4ad92486602285f8:v1.11.0
  # Add worker role label for kubectl display
  - |-
    machine:
      nodeLabels:
        node-role.kubernetes.io/worker: ""
  # Longhorn storage configuration - mount secondary disk for Longhorn
  - |-
    machine:
      kubelet:
        extraMounts:
          - destination: /var/lib/longhorn
            type: bind
            source: /var/lib/longhorn
            options:
              - bind
              - rshared
              - rw
      disks:
        - device: /dev/vdb
          partitions:
            - mountpoint: /var/lib/longhorn

