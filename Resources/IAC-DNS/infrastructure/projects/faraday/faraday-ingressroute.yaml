# Faraday IngressRoute
# Access via: https://faraday.knowledgeondemand.net
#
# TLS: Uses wildcard certificate from default TLSStore
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: faraday
  namespace: faraday
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`faraday.knowledgeondemand.net`)
      kind: Rule
      services:
        - name: faraday
          port: 5985
      middlewares:
        - name: secure-headers
          namespace: traefik
  tls: {}
  # Uses default TLSStore with knowledgeondemand-wildcard-tls certificate
