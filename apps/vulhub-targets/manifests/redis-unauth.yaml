# Vulhub: Redis Unauthorized Access — no authentication
# Source: https://github.com/vulhub/vulhub/tree/master/redis/4-unacc
# Port: 6379 (Redis)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-unauth
  labels:
    app.kubernetes.io/name: redis-unauth
    app.kubernetes.io/part-of: vulhub-targets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-unauth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis-unauth
    spec:
      containers:
        - name: redis
          image: vulhub/redis:5.0.7
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis-unauth
  labels:
    app.kubernetes.io/name: redis-unauth
    app.kubernetes.io/part-of: vulhub-targets
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis-unauth
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
