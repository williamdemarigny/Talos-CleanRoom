# Vulhub: Nginx Misconfiguration — directory traversal, alias bypass
# Source: https://github.com/vulhub/vulhub/tree/master/nginx/insecure-configuration
# Port: 8080 (Nginx)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-misconfig
  labels:
    app.kubernetes.io/name: nginx-misconfig
    app.kubernetes.io/part-of: vulhub-targets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-misconfig
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-misconfig
    spec:
      containers:
        - name: nginx
          image: vulhub/nginx:insecure-configuration
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-misconfig
  labels:
    app.kubernetes.io/name: nginx-misconfig
    app.kubernetes.io/part-of: vulhub-targets
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nginx-misconfig
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
