# Keycloak Identity Provider Network Policy
# =============================================================================
# Keycloak needs:
# - Ingress from Traefik (external OIDC endpoints + admin console)
# - Ingress from app namespaces (JWKS/token validation)
# - Egress to cleanroom-db (PostgreSQL)
# - Egress to DNS (service discovery)
# - Egress to Traefik (self-referencing FQDN for well-known endpoint)
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-keycloak-traffic
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from Traefik (external OIDC + admin console)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8080
    # Allow from Portal (OIDC token exchange, JWKS fetching)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: portal
      ports:
        - protocol: TCP
          port: 8080
    # Allow from Scanning Console (OIDC token exchange, JWKS fetching)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: scanning-console
      ports:
        - protocol: TCP
          port: 8080
    # Allow from ArgoCD (OIDC token validation)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: argocd
      ports:
        - protocol: TCP
          port: 8080
    # Allow from OAuth2-Proxy (ForwardAuth token validation)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: oauth2-proxy
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow to cleanroom-db PostgreSQL
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cleanroom-db
      ports:
        - protocol: TCP
          port: 5432
    # Allow to Traefik — Keycloak may self-reference its FQDN
    # for well-known endpoint and token validation
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 443
---
# OAuth2-Proxy Network Policy
# Used for ForwardAuth on Faraday, OpenVAS, Threat Dragon
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-oauth2-proxy-traffic
  namespace: oauth2-proxy
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow from Traefik (ForwardAuth requests)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 4180
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow to Keycloak (OIDC token validation)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
      ports:
        - protocol: TCP
          port: 8080
