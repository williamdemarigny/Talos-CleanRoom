# OWASP Threat Dragon ArgoCD Application
# Deploys threat modeling tool from local manifests
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: threat-dragon
  namespace: argocd
  finalizers:
    - argoproj.io/resources-finalizer
spec:
  project: default
  source:
    repoURL: git@github.com:williamdemarigny/Talos-CleanRoom.git
    targetRevision: main
    path: apps/threat-dragon
    directory:
      recurse: false
      include: '*.yaml'
      exclude: '{application.yaml,*.sops.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: threat-dragon
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
