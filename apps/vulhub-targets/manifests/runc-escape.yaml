# Vulhub: runc Container Escape (CVE-2019-5736) — DEMO ONLY
# Source: https://github.com/vulhub/vulhub/tree/master/runc/CVE-2019-5736
# Port: 80 (HTTP demo page)
# Note: Runs unprivileged — demonstrates the vulnerability concept without
# enabling actual container escape.  securityContext.privileged is false.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runc-escape
  labels:
    app.kubernetes.io/name: runc-escape
    app.kubernetes.io/part-of: vulhub-targets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: runc-escape
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runc-escape
    spec:
      containers:
        - name: runc
          image: vulhub/runc:1.0.0-rc6
          ports:
            - containerPort: 80
              protocol: TCP
          securityContext:
            privileged: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: runc-escape
  labels:
    app.kubernetes.io/name: runc-escape
    app.kubernetes.io/part-of: vulhub-targets
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: runc-escape
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
