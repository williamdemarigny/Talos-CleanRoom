# Keycloak IngressRoute — exposes Keycloak admin console and OIDC endpoints
# at keycloak.knowledgeondemand.net via Traefik
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`keycloak.knowledgeondemand.net`)
      kind: Rule
      services:
        - name: keycloak
          port: 80
      middlewares:
        - name: secure-headers
          namespace: traefik
  tls:
    secretName: knowledgeondemand-wildcard-tls
