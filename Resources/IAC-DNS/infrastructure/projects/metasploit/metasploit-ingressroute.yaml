# Metasploit Framework IngressRoute
# Access via: https://metasploit.knowledgeondemand.net
#
# Note: This exposes the msfrpcd RPC API. For security, basic-auth middleware
# is applied in addition to msfrpcd's own authentication.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: metasploit
  namespace: metasploit
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`metasploit.knowledgeondemand.net`)
      kind: Rule
      services:
        - name: metasploit
          port: 55553
      middlewares:
        - name: secure-headers
          namespace: traefik
        - name: basic-auth
          namespace: traefik
  tls:
    secretName: metasploit-tls
---
# TLS Certificate
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: metasploit-cert
  namespace: metasploit
spec:
  secretName: metasploit-tls
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
  commonName: metasploit.knowledgeondemand.net
  dnsNames:
    - metasploit.knowledgeondemand.net
