apiVersion: v1
kind: Namespace
metadata:
  name: kubescape
  labels:
    app.kubernetes.io/name: kubescape
    app.kubernetes.io/component: security-scanning
    # Pod Security Standards: baseline
    # Kubescape needs some capabilities for scanning but not full privileged access
    # - enforce: baseline allows necessary capabilities
    # - audit/warn: log restricted violations for awareness
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
