{% extends "base.html" %}

{% block title %}Deployment - Talos CleanRoom{% endblock %}

{% block content %}
<div x-data="deploymentMonitor()" x-init="init()">
    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-2xl font-bold text-white">Deployment Monitor</h1>
            <p class="text-gray-400">Real-time deployment progress</p>
        </div>
        <div class="flex gap-4">
            <button
                @click="startDeployment"
                :disabled="isRunning"
                x-show="status !== 'running'"
                class="px-4 py-2 bg-cyan-600 text-white rounded-md hover:bg-cyan-700 disabled:opacity-50 disabled:cursor-not-allowed"
            >
                Start Deployment
            </button>
            <button
                @click="abortDeployment"
                x-show="isRunning"
                class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700"
            >
                Abort
            </button>
        </div>
    </div>

    <!-- Status Banner -->
    <div class="mb-6 p-4 rounded-lg" :class="statusBannerClass">
        <div class="flex items-center justify-between">
            <div class="flex items-center">
                <span class="text-lg font-medium" x-text="statusText"></span>
                <span x-show="isRunning" class="ml-3">
                    <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </span>
            </div>
            <div class="text-sm" x-show="elapsedTime">
                Elapsed: <span x-text="elapsedTime"></span>
            </div>
        </div>
    </div>

    <!-- Progress Steps -->
    <div class="bg-gray-800 rounded-lg p-6 mb-6">
        <h2 class="text-lg font-medium text-white mb-4">Deployment Steps</h2>
        <div class="space-y-3">
            <template x-for="step in steps" :key="step.id">
                <div class="flex items-center p-3 rounded-lg" :class="stepClass(step)">
                    <!-- Status Icon -->
                    <div class="flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-full mr-4" :class="stepIconClass(step)">
                        <!-- Pending -->
                        <span x-show="step.status === 'pending'" class="text-gray-500">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="10" stroke-width="2"/>
                            </svg>
                        </span>
                        <!-- Running -->
                        <span x-show="step.status === 'running'" class="text-yellow-400">
                            <svg class="animate-spin w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                            </svg>
                        </span>
                        <!-- Success -->
                        <span x-show="step.status === 'success'" class="text-green-400">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
                            </svg>
                        </span>
                        <!-- Failed -->
                        <span x-show="step.status === 'failed'" class="text-red-400">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                                <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
                            </svg>
                        </span>
                    </div>

                    <!-- Step Info -->
                    <div class="flex-grow">
                        <div class="flex items-center justify-between">
                            <span class="font-medium" x-text="'Step ' + step.id + ': ' + step.description"></span>
                            <span class="text-sm text-gray-400" x-show="step.started_at" x-text="formatDuration(step)"></span>
                        </div>
                        <p class="text-sm text-red-400" x-show="step.error_message" x-text="step.error_message"></p>
                    </div>

                    <!-- Expand/Collapse -->
                    <button
                        @click="toggleStep(step.id)"
                        class="ml-4 text-gray-400 hover:text-white"
                        x-show="getStepLogs(step.id).length > 0"
                    >
                        <svg class="w-5 h-5 transform transition-transform" :class="expandedSteps.includes(step.id) ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>
                </div>

                <!-- Step Logs -->
                <div
                    x-show="expandedSteps.includes(step.id)"
                    x-collapse
                    class="ml-12 bg-gray-900 rounded p-4 font-mono text-sm max-h-64 overflow-y-auto"
                >
                    <template x-for="log in getStepLogs(step.id)" :key="log.timestamp">
                        <div :class="logClass(log)">
                            <span class="text-gray-500" x-text="formatTime(log.timestamp)"></span>
                            <span x-text="log.message"></span>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </div>

    <!-- Live Log Stream -->
    <div class="bg-gray-800 rounded-lg p-6">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-medium text-white">Live Log Stream</h2>
            <div class="flex gap-2">
                <button
                    @click="autoScroll = !autoScroll"
                    class="px-3 py-1 text-sm rounded"
                    :class="autoScroll ? 'bg-cyan-600 text-white' : 'bg-gray-700 text-gray-300'"
                >
                    Auto-scroll
                </button>
                <button
                    @click="clearLogs"
                    class="px-3 py-1 text-sm bg-gray-700 text-gray-300 rounded hover:bg-gray-600"
                >
                    Clear
                </button>
            </div>
        </div>
        <div
            x-ref="logContainer"
            class="bg-gray-900 rounded p-4 font-mono text-sm h-64 overflow-y-auto"
        >
            <template x-for="log in logs" :key="log.timestamp + log.message">
                <div :class="logClass(log)">
                    <span class="text-gray-500" x-text="formatTime(log.timestamp)"></span>
                    <span class="text-gray-400" x-text="'[Step ' + log.step_id + ']'"></span>
                    <span x-text="log.message"></span>
                </div>
            </template>
            <div x-show="logs.length === 0" class="text-gray-500">
                No logs yet. Start a deployment to see output.
            </div>
        </div>
    </div>

    <!-- Connection Status -->
    <div class="fixed bottom-4 right-4">
        <div class="px-3 py-1 rounded-full text-sm" :class="wsConnected ? 'bg-green-600' : 'bg-red-600'">
            <span x-text="wsConnected ? 'Connected' : 'Disconnected'"></span>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/websocket.js"></script>
<script src="/static/js/deployment.js"></script>
{% endblock %}
