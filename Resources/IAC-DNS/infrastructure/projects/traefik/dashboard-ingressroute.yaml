# Traefik Dashboard IngressRoute
# Apply AFTER Traefik is fully deployed
#
# Access the dashboard at: https://traefik.knowledgeondemand.net
#
# IMPORTANT: This exposes the Traefik dashboard with basic auth protection
# Create the basic-auth-secret first (see middlewares.yaml for instructions)
#
# TLS: Uses wildcard certificate from default TLSStore
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`traefik.knowledgeondemand.net`)
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService
      middlewares:
        - name: basic-auth
          namespace: traefik
        - name: secure-headers
          namespace: traefik
  tls: {}
  # Uses default TLSStore with knowledgeondemand-wildcard-tls certificate
