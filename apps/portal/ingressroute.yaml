# Unified Portal IngressRoute
# Access via: https://cleanroom.knowledgeondemand.net
#
# TLS: Uses wildcard certificate from default TLSStore
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: portal
  namespace: portal
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cleanroom.knowledgeondemand.net`)
      kind: Rule
      services:
        - name: portal
          port: 8000
      middlewares:
        - name: secure-headers
          namespace: traefik
  tls: {}
  # Uses default TLSStore with knowledgeondemand-wildcard-tls certificate
