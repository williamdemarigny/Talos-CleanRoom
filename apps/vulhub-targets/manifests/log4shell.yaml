# Vulhub: Log4Shell (CVE-2021-44228) — Apache Solr 8.11.0
# Source: https://github.com/vulhub/vulhub/tree/master/log4j/CVE-2021-44228
# Port: 8983 (Solr admin UI + API)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log4shell
  labels:
    app.kubernetes.io/name: log4shell
    app.kubernetes.io/part-of: vulhub-targets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: log4shell
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log4shell
    spec:
      containers:
        - name: solr
          image: vulhub/solr:8.11.0
          ports:
            - containerPort: 8983
              protocol: TCP
          # Solr is a Java app and needs more resources than the original
          # 512Mi limit which causes JVM OOM during startup.
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
          # Solr takes ~30-60s to start (Java + index loading); the readiness
          # path /solr/ returns 302 redirect to /solr/#/ which kubelet treats
          # as success. Use a generous startup window.
          readinessProbe:
            httpGet:
              path: /solr/
              port: 8983
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /solr/
              port: 8983
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: log4shell
  labels:
    app.kubernetes.io/name: log4shell
    app.kubernetes.io/part-of: vulhub-targets
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: log4shell
  ports:
    - port: 8983
      targetPort: 8983
      protocol: TCP
      name: solr
