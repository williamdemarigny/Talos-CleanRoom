apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: deployment-console
  namespace: argocd
  finalizers:
    - argoproj.io/resources-finalizer
  annotations:
    # Wave 1: Same as other apps (namespace + Service + IngressRoute only)
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: git@github.com:williamdemarigny/Talos-CleanRoom.git
    targetRevision: refactor/restructure
    path: apps/deployment-console
    directory:
      recurse: false
      exclude: '{application.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: deployment-console
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
