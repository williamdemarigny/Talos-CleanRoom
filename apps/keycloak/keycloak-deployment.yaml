# Keycloak SSO — Official Keycloak image from Quay.io
# Uses quay.io/keycloak/keycloak (not Bitnami) to avoid Docker Hub rate limits
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: identity
    spec:
      # ============================================================
      # INIT CONTAINERS
      # ============================================================
      initContainers:
      - name: wait-for-db
        image: postgres:17-alpine
        command:
          - sh
          - -c
          - |
            echo "Waiting for cleanroom-db to be ready..."
            until pg_isready -h cleanroom-db.cleanroom-db.svc.cluster.local -p 5432 -U keycloak -d keycloak; do
              echo "  Database not ready, retrying in 5s..."
              sleep 5
            done
            echo "Database is ready."
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "100m"

      # ============================================================
      # MAIN CONTAINER
      # ============================================================
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.0
        args:
          - start
          - --optimized=false
        env:
        # Database
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL
          value: jdbc:postgresql://cleanroom-db.cleanroom-db.svc.cluster.local:5432/keycloak
        - name: KC_DB_USERNAME
          value: keycloak
        - name: KC_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-db-credentials
              key: postgres-password
        # Admin credentials
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: admin
        - name: KC_BOOTSTRAP_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: keycloak-credentials
              key: admin-password
        # Hostname & Proxy
        - name: KC_HOSTNAME
          value: keycloak.knowledgeondemand.net
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_PROXY_HEADERS
          value: xforwarded
        - name: KC_HTTP_ENABLED
          value: "true"
        - name: KC_HEALTH_ENABLED
          value: "true"
        - name: KC_METRICS_ENABLED
          value: "true"
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9000
          name: management
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /health/started
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health/live
            port: 9000
          initialDelaySeconds: 60
          periodSeconds: 30
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/component: identity
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
