# Vulhub: Spring4Shell (CVE-2022-22965) — Spring Framework RCE
# Source: https://github.com/vulhub/vulhub/tree/master/spring/CVE-2022-22965
# Port: 8080 (Tomcat with vulnerable Spring app)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring4shell
  labels:
    app.kubernetes.io/name: spring4shell
    app.kubernetes.io/part-of: vulhub-targets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spring4shell
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spring4shell
    spec:
      containers:
        - name: spring
          image: vulhub/spring-core:5.3.17
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: spring4shell
  labels:
    app.kubernetes.io/name: spring4shell
    app.kubernetes.io/part-of: vulhub-targets
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: spring4shell
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
