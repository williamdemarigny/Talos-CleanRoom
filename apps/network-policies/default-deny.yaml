# Metasploit namespace - deny all ingress by default
# Note: Egress is intentionally NOT denied as Metasploit needs
# unrestricted outbound access for penetration testing
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: metasploit
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
