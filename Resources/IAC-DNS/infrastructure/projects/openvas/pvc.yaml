# Greenbone Community Edition - Persistent Volume Claims
# Converted from docker-compose.yml at https://greenbone.github.io/docs/latest/_static/docker-compose.yml
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gpg-data
  namespace: openvas
  labels:
    app.kubernetes.io/name: greenbone
    app.kubernetes.io/component: data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: ceph-rbd
---
