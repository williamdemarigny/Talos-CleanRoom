apiVersion: v1
kind: Namespace
metadata:
  name: metasploit
  labels:
    app.kubernetes.io/name: metasploit
    app.kubernetes.io/component: penetration-testing
    # Metasploit requires privileged access for network scanning capabilities
    # (NET_ADMIN, NET_RAW capabilities for exploit modules)
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
