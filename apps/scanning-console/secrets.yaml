# Scanning Console - Secrets
# =============================================================================
# IMPORTANT: This file should be SOPS-encrypted before committing.
#
# To encrypt:
#   sops -e -i secrets.yaml
#   mv secrets.yaml secrets.sops.yaml
#
# To decrypt and apply:
#   sops -d secrets.sops.yaml | kubectl apply -f -
# =============================================================================
---
apiVersion: v1
kind: Secret
metadata:
  name: scanning-console-credentials
  namespace: scanning-console
  labels:
    app.kubernetes.io/name: scanning-console
    app.kubernetes.io/component: security-console
type: Opaque
stringData:
  secret-key: "CHANGE_ME_BEFORE_ENCRYPTING"
  database-url: "postgresql+asyncpg://cleanroom:CHANGE_ME@cleanroom-db.cleanroom-db.svc.cluster.local:5432/cleanroom"
  admin-password-hash: "CHANGE_ME_BCRYPT_HASH"
