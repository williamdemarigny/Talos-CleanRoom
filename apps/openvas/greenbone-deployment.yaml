# Greenbone Community Edition - Main Deployment
# Converted from docker-compose.yml at https://greenbone.github.io/docs/latest/_static/docker-compose.yml
#
# All services are in a single pod because they communicate via Unix sockets.
# This matches the docker-compose architecture where containers share socket volumes.
#
# Architecture:
# - Init containers: Data feed synchronization (vulnerability-tests, notus-data, scap-data, etc.)
# - Init containers: PostgreSQL migration, OpenVAS configuration
# - Main containers: redis, postgresql, gvmd, gsa, ospd-openvas, openvasd
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenbone
  namespace: openvas
  labels:
    app.kubernetes.io/name: greenbone
    app.kubernetes.io/component: vulnerability-scanner
spec:
  replicas: 1
  strategy:
    type: Recreate  # Required for RWO PVCs
  selector:
    matchLabels:
      app.kubernetes.io/name: greenbone
  template:
    metadata:
      labels:
        app.kubernetes.io/name: greenbone
        app.kubernetes.io/component: scanner
        app.kubernetes.io/part-of: security-platform
    spec:
      # Enables the pause container as PID 1, which automatically reaps zombie
      # child processes (defunct nmap/openvas workers from completed scans).
      # Without this, ospd-openvas (PID 1) doesn't call waitpid() on orphans.
      shareProcessNamespace: true
      imagePullSecrets:
      - name: harbor-pull-secret
      # ============================================================
      # INIT CONTAINERS - Data feeds and configuration
      # ============================================================
      initContainers:
      # 1. Vulnerability Tests Data Feed
      - name: vulnerability-tests
        image: harbor.knowledgeondemand.net/cleanroom/vulnerability-tests:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: FEED_RELEASE
          value: "24.10"
        volumeMounts:
        - name: vt-data
          mountPath: /mnt
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"

      # 2. Notus Data Feed
      - name: notus-data
        image: harbor.knowledgeondemand.net/cleanroom/notus-data:latest
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: notus-data
          mountPath: /mnt
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"

      # 3. SCAP Data Feed
      - name: scap-data
        image: harbor.knowledgeondemand.net/cleanroom/scap-data:latest
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: scap-data
          mountPath: /mnt
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"

      # 4. CERT-Bund Data Feed
      - name: cert-bund-data
        image: harbor.knowledgeondemand.net/cleanroom/cert-bund-data:latest
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: cert-data
          mountPath: /mnt
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"

      # 5. DFN-CERT Data Feed (runs after cert-bund-data)
      - name: dfn-cert-data
        image: harbor.knowledgeondemand.net/cleanroom/dfn-cert-data:latest
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: cert-data
          mountPath: /mnt
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"

      # 6. Data Objects
      - name: data-objects
        image: harbor.knowledgeondemand.net/cleanroom/data-objects:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: FEED_RELEASE
          value: "24.10"
        volumeMounts:
        - name: data-objects
          mountPath: /mnt
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"

      # 7. Report Formats (runs after data-objects)
      - name: report-formats
        image: harbor.knowledgeondemand.net/cleanroom/report-formats:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: FEED_RELEASE
          value: "24.10"
        volumeMounts:
        - name: data-objects
          mountPath: /mnt
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"

      # 8. GPG Data
      - name: gpg-data
        image: harbor.knowledgeondemand.net/cleanroom/gpg-data:latest
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: gpg-data
          mountPath: /mnt
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"

      # 9. PostgreSQL Data Directory Setup
      # Initialize PostgreSQL data directory with proper structure for pg-gvm
      - name: psql-data-setup
        image: harbor.knowledgeondemand.net/cleanroom/pg-gvm:stable
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-c"]
        args:
          - |
            set -e
            echo "Setting up PostgreSQL data directory..."

            # Set ownership first
            chown -R postgres:postgres /var/lib/postgresql
            chmod 700 /var/lib/postgresql

            # Check if cluster already initialized
            if [ -f /var/lib/postgresql/17/main/PG_VERSION ]; then
              echo "PostgreSQL cluster already exists."
              exit 0
            fi

            echo "Initializing PostgreSQL 17 cluster..."
            mkdir -p /var/lib/postgresql/17/main
            chown -R postgres:postgres /var/lib/postgresql/17
            chmod 700 /var/lib/postgresql/17/main

            # Run initdb as postgres user
            su postgres -c "/usr/lib/postgresql/17/bin/initdb -D /var/lib/postgresql/17/main"

            echo "PostgreSQL data directory ready."
        volumeMounts:
        - name: psql-data
          mountPath: /var/lib/postgresql
        securityContext:
          runAsUser: 0
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
            cpu: "500m"

      # 10. GVMD Data Directory Setup
      # Initialize GVMD data directory with proper structure and permissions
      - name: gvmd-data-setup
        image: harbor.knowledgeondemand.net/cleanroom/gvmd:stable
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "Setting up GVMD data directory..."

            # Create required directories
            mkdir -p /var/lib/gvm/gvmd

            # Set ownership to gvmd user (UID 1001)
            chown -R 1001:1001 /var/lib/gvm
            chmod 755 /var/lib/gvm
            chmod 755 /var/lib/gvm/gvmd

            echo "GVMD data directory ready."
        volumeMounts:
        - name: gvmd-data
          mountPath: /var/lib/gvm
        securityContext:
          runAsUser: 0
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"

      # 11. Configure OpenVAS
      - name: configure-openvas
        image: harbor.knowledgeondemand.net/cleanroom/openvas-scanner:stable
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            printf "table_driven_lsc = yes\nopenvasd_server = http://127.0.0.1:8090\n" > /mnt/openvas.conf
            sed "s/127/128/" /etc/openvas/openvas_log.conf | sed 's/gvm/openvas/' > /mnt/openvas_log.conf
            chmod 644 /mnt/openvas.conf
            chmod 644 /mnt/openvas_log.conf
            touch /var/log/openvas/openvas.log
            chmod 666 /var/log/openvas/openvas.log
        volumeMounts:
        - name: openvas-data
          mountPath: /mnt
        - name: openvas-log-data
          mountPath: /var/log/openvas
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"

      # 12. Copy GSA React frontend assets into a shared emptyDir.
      # The gsad daemon image (ghcr.io/greenbone/gsad:24.8.0) is daemon-only
      # and doesn't bundle the web UI. The separate gsa image contains the
      # React assets at /usr/local/share/gvm/gsad/web. We copy them into a
      # shared volume that the gsa container mounts at the same path.
      - name: gsa-web-assets
        image: ghcr.io/greenbone/gsa:23.1.1
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c"]
        args:
          - |
            echo "Copying GSA web assets to shared volume..."
            cp -a /usr/local/share/gvm/gsad/web/. /mnt/web/
            echo "Web assets copied:"
            ls -la /mnt/web/ | head -10
        volumeMounts:
        - name: gsa-web
          mountPath: /mnt/web
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"

      # ============================================================
      # MAIN CONTAINERS
      # ============================================================
      containers:
      # 1. Redis Server (must start first - other services depend on it)
      - name: redis-server
        image: harbor.knowledgeondemand.net/cleanroom/redis-server:latest
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: redis-socket
          mountPath: /run/redis/
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "4Gi"
            cpu: "500m"
        startupProbe:
          exec:
            command: ["redis-cli", "-s", "/run/redis/redis.sock", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 12
        readinessProbe:
          exec:
            command: ["redis-cli", "-s", "/run/redis/redis.sock", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 10

      # 2. PostgreSQL with GVM extensions
      # Tuned for fast feed import — gvmd imports millions of CVE/NVT records on first start.
      # Default PostgreSQL settings (shared_buffers=128MB) cause this to take 24+ hours.
      # The pg-gvm image uses a custom start-postgresql script as CMD.
      # We inject tuning via conf.d/ before calling it (Debian pg_createcluster includes conf.d).
      - name: pg-gvm
        image: harbor.knowledgeondemand.net/cleanroom/pg-gvm:stable
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/entrypoint"]
        args:
          - "sh"
          - "-c"
          - |
            mkdir -p /etc/postgresql/17/main/conf.d
            cat > /etc/postgresql/17/main/conf.d/tuning.conf << 'PGEOF'
            shared_buffers = 1GB
            work_mem = 128MB
            maintenance_work_mem = 1GB
            effective_cache_size = 2GB
            max_wal_size = 2GB
            checkpoint_completion_target = 0.9
            wal_buffers = 32MB
            synchronous_commit = off
            PGEOF
            exec start-postgresql
        volumeMounts:
        - name: psql-data
          mountPath: /var/lib/postgresql
        - name: psql-socket
          mountPath: /var/run/postgresql
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "3000m"
        startupProbe:
          exec:
            command: ["pg_isready", "-h", "/var/run/postgresql", "-U", "postgres"]
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          exec:
            command: ["pg_isready", "-h", "/var/run/postgresql", "-U", "postgres"]
          initialDelaySeconds: 60
          periodSeconds: 10

      # 3. OpenVAS Scanner Daemon (Notus mode)
      - name: openvasd
        image: harbor.knowledgeondemand.net/cleanroom/openvas-scanner:stable
        imagePullPolicy: IfNotPresent
        env:
        - name: OPENVASD_MODE
          value: service_notus
        - name: GNUPGHOME
          value: /etc/openvas/gnupg
        - name: LISTENING
          value: "0.0.0.0:8090"
        ports:
        - containerPort: 8090
          name: openvasd
        volumeMounts:
        - name: openvas-data
          mountPath: /etc/openvas
        - name: openvas-log-data
          mountPath: /var/log/openvas
        - name: gpg-data
          mountPath: /etc/openvas/gnupg
        - name: notus-data
          mountPath: /var/lib/notus
        resources:
          requests:
            memory: "128Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "2000m"
        startupProbe:
          httpGet:
            path: /health/ready
            port: 8090
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8090
          initialDelaySeconds: 30
          periodSeconds: 10

      # 4. OSPD-OpenVAS (Scanner Protocol Daemon)
      - name: ospd-openvas
        image: harbor.knowledgeondemand.net/cleanroom/ospd-openvas:stable
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Waiting for Redis socket..."
            while [ ! -S /run/redis/redis.sock ]; do sleep 2; done
            echo "Redis ready. Starting OSPD-OpenVAS..."
            exec ospd-openvas -f --config /etc/gvm/ospd-openvas.conf --notus-feed-dir /var/lib/notus/advisories -m 666
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
              - NET_RAW
        volumeMounts:
        - name: gpg-data
          mountPath: /etc/openvas/gnupg
        - name: vt-data
          mountPath: /var/lib/openvas/plugins
        - name: notus-data
          mountPath: /var/lib/notus
        - name: ospd-socket
          mountPath: /run/ospd
        - name: redis-socket
          mountPath: /run/redis/
        - name: openvas-data
          mountPath: /etc/openvas/
        - name: openvas-log-data
          mountPath: /var/log/openvas
        resources:
          requests:
            memory: "512Mi"
            cpu: "200m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        startupProbe:
          exec:
            command: ["test", "-S", "/run/ospd/ospd-openvas.sock"]
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          exec:
            command: ["test", "-S", "/run/ospd/ospd-openvas.sock"]
          initialDelaySeconds: 60
          periodSeconds: 10

      # 5. GVMD (Greenbone Vulnerability Manager Daemon)
      - name: gvmd
        image: harbor.knowledgeondemand.net/cleanroom/gvmd:stable
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Waiting for PostgreSQL socket..."
            while [ ! -S /var/run/postgresql/.s.PGSQL.5432 ]; do sleep 2; done
            echo "PostgreSQL ready. Waiting for OSPD socket..."
            while [ ! -S /run/ospd/ospd-openvas.sock ]; do sleep 2; done
            echo "OSPD ready."

            # Create admin user if it doesn't exist (first run only)
            # Run as gvmd user via gosu to connect to PostgreSQL properly
            # Password is injected via GVMD_ADMIN_PASSWORD environment variable
            if ! gosu gvmd gvmd --get-users 2>/dev/null | grep -q "^admin$"; then
              echo "Creating admin user..."
              gosu gvmd gvmd --create-user=admin --password="${GVMD_ADMIN_PASSWORD}" || echo "User creation failed or already exists"
            else
              echo "Admin user already exists."
            fi

            # Set Feed Import Owner to admin user (required for feed synchronization)
            # The setting UUID 78eceaec-3385-11ea-b237-28d24461215b is the Feed Import Owner setting
            echo "Setting Feed Import Owner..."
            ADMIN_UUID=$(gosu gvmd gvmd --get-users --verbose 2>/dev/null | grep "^admin " | awk '{print $2}')
            if [ -n "$ADMIN_UUID" ]; then
              gosu gvmd gvmd --modify-setting 78eceaec-3385-11ea-b237-28d24461215b --value "$ADMIN_UUID" 2>/dev/null || echo "Feed owner setting may already be configured"
              echo "Feed Import Owner set to admin ($ADMIN_UUID)"
            else
              echo "Warning: Could not determine admin UUID for Feed Import Owner"
            fi

            echo "Starting GVMD..."
            # gsad v24 talks plain GMP on the Unix socket (no TLS).
            # We pin gsad to v24 because v25 has a segfault bug on form POSTs.
            exec /usr/local/bin/entrypoint gvmd -f
        env:
        - name: GVMD_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openvas-credentials
              key: admin-password
        volumeMounts:
        - name: gvmd-data
          mountPath: /var/lib/gvm
        - name: scap-data
          mountPath: /var/lib/gvm/scap-data/
        - name: cert-data
          mountPath: /var/lib/gvm/cert-data
        - name: data-objects
          mountPath: /var/lib/gvm/data-objects/gvmd
        - name: vt-data
          mountPath: /var/lib/openvas/plugins
        - name: gvmd-socket
          mountPath: /run/gvmd
        - name: ospd-socket
          mountPath: /run/ospd
        - name: psql-socket
          mountPath: /var/run/postgresql
        resources:
          requests:
            memory: "2Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "4000m"
        # GVMD takes significant time on first start (socket wait + user creation + feed sync)
        # Allow up to 25 min for the socket to appear
        startupProbe:
          exec:
            command: ["test", "-S", "/run/gvmd/gvmd.sock"]
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 120
        readinessProbe:
          exec:
            command: ["test", "-S", "/run/gvmd/gvmd.sock"]
          initialDelaySeconds: 30
          periodSeconds: 10

      # 6. GSA (Greenbone Security Assistant - Web UI)
      # Pinned to gsad v24.8.0 from ghcr.io because the upstream :stable tag
      # (gsad v25.0.0) has a critical segfault bug that crashes the daemon on
      # any form-encoded POST to /gmp (login attempts always fail).
      # gsad v24 also doesn't bundle the React frontend assets — the image
      # is daemon-only, so it serves the GMP API and a basic 404 for everything
      # else. The full GSA web UI is shipped via the separate gsa image, but
      # for now we just need the GMP login flow to work.
      # gsad v24 runs as non-root (UID 1001) and cannot bind to privileged
      # port 80, so it listens on 9392 inside the pod. The Service maps
      # external port 80 → targetPort 9392.
      - name: gsa
        image: ghcr.io/greenbone/gsad:24.8.0
        imagePullPolicy: IfNotPresent
        env:
        - name: GSAD_ARGS
          value: "-f --http-only --port=9392 --munix-socket=/run/gvmd/gvmd.sock"
        ports:
        - containerPort: 9392
          name: http
        volumeMounts:
        - name: gvmd-socket
          mountPath: /run/gvmd
        - name: gvmd-data
          mountPath: /var/lib/gvm
          readOnly: true
        # React frontend assets from gsa:23.1.1 (populated by init container)
        - name: gsa-web
          mountPath: /usr/local/share/gvm/gsad/web
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        # startupProbe gates liveness/readiness — prevents kill during GVMD socket wait
        # GVMD can take 15+ min on first start (feed sync), so allow up to 30 min
        startupProbe:
          tcpSocket:
            port: 9392
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 120
        readinessProbe:
          tcpSocket:
            port: 9392
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 9392
          periodSeconds: 30
          failureThreshold: 20

      # ============================================================
      # VOLUMES
      # ============================================================
      volumes:
      # Persistent Volume Claims (data that persists)
      - name: gpg-data
        persistentVolumeClaim:
          claimName: gpg-data
      - name: scap-data
        persistentVolumeClaim:
          claimName: scap-data
      - name: cert-data
        persistentVolumeClaim:
          claimName: cert-data
      - name: data-objects
        persistentVolumeClaim:
          claimName: data-objects
      - name: gvmd-data
        persistentVolumeClaim:
          claimName: gvmd-data
      - name: psql-data
        persistentVolumeClaim:
          claimName: psql-data
      - name: vt-data
        persistentVolumeClaim:
          claimName: vt-data
      - name: notus-data
        persistentVolumeClaim:
          claimName: notus-data
      - name: openvas-data
        persistentVolumeClaim:
          claimName: openvas-data
      - name: openvas-log-data
        persistentVolumeClaim:
          claimName: openvas-log-data
      # EmptyDir volumes for socket communication (ephemeral)
      - name: redis-socket
        emptyDir: {}
      - name: psql-socket
        emptyDir: {}
      - name: gvmd-socket
        emptyDir: {}
      - name: ospd-socket
        emptyDir: {}
      # GSA React web assets — populated by init container from gsa:23.1.1
      - name: gsa-web
        emptyDir: {}
# =============================================================================
# SECRETS - Managed externally via SOPS encryption
# =============================================================================
# The secrets referenced by this deployment are stored in:
#   secrets.sops.yaml (SOPS-encrypted)
#
# To generate new secrets:
#   ../../../scripts/generate-secrets.sh
#
# To apply secrets (decrypts and applies):
#   sops -d secrets.sops.yaml | kubectl apply -f -
#
# Required secrets:
#   - openvas-credentials: (keys: admin-password, postgres-password)
# =============================================================================
