# Vulhub: PHP-FPM RCE (CVE-2019-11043)
# Source: https://github.com/vulhub/vulhub/tree/master/php/CVE-2019-11043
# Port: 8080 (Nginx + PHP-FPM)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: php-fpm-rce
  labels:
    app.kubernetes.io/name: php-fpm-rce
    app.kubernetes.io/part-of: vulhub-targets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: php-fpm-rce
  template:
    metadata:
      labels:
        app.kubernetes.io/name: php-fpm-rce
    spec:
      containers:
        - name: php-fpm
          image: vulhub/php:7.1.10-fpm-stretch-with-nginx
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: php-fpm-rce
  labels:
    app.kubernetes.io/name: php-fpm-rce
    app.kubernetes.io/part-of: vulhub-targets
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: php-fpm-rce
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
