# Scanning Console IngressRoute
# Access via: https://scan.knowledgeondemand.net
#
# TLS: Uses wildcard certificate from default TLSStore
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: scanning-console
  namespace: scanning-console
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`scan.knowledgeondemand.net`)
      kind: Rule
      services:
        - name: scanning-console
          port: 8000
      middlewares:
        - name: secure-headers
          namespace: traefik
  tls: {}
  # Uses default TLSStore with knowledgeondemand-wildcard-tls certificate
