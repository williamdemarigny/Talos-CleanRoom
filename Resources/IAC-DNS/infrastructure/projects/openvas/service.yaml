# Greenbone Community Edition - Services
---
apiVersion: v1
kind: Service
metadata:
  name: greenbone
  namespace: openvas
  labels:
    app.kubernetes.io/name: greenbone
    app.kubernetes.io/component: vulnerability-scanner
spec:
  selector:
    app: greenbone
  ports:
  # GSA Web UI
  - port: 80
    targetPort: 80
    name: http
  # OpenVAS Scanner Daemon (internal)
  - port: 8090
    targetPort: 8090
    name: openvasd
