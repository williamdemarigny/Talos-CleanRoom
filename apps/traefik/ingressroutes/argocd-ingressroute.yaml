# ArgoCD IngressRoute
# Apply AFTER Traefik is fully deployed
#
# Access ArgoCD at: https://argocd.knowledgeondemand.net
#
# Note: ArgoCD uses gRPC for some features, so we need both HTTP and gRPC routes
#
# TLS: Uses wildcard certificate from default TLSStore
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: argocd-server
  namespace: argocd
spec:
  entryPoints:
    - websecure
  routes:
    # ArgoCD Web UI
    - match: Host(`argocd.knowledgeondemand.net`)
      kind: Rule
      priority: 10
      services:
        - name: argocd-server
          port: 80
      middlewares:
        - name: secure-headers
          namespace: traefik
    # ArgoCD gRPC (for CLI)
    # Note: Traefik v3 renamed HeadersRegexp to HeaderRegexp (singular)
    - match: Host(`argocd.knowledgeondemand.net`) && HeaderRegexp(`Content-Type`, `^application/grpc.*`)
      kind: Rule
      priority: 11
      services:
        - name: argocd-server
          port: 80
          scheme: h2c
  tls: {}
  # Uses default TLSStore with knowledgeondemand-wildcard-tls certificate
