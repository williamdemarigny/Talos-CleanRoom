# Vulhub: Tomcat PUT (CVE-2017-12615) — Apache Tomcat remote code execution
# Source: https://github.com/vulhub/vulhub/tree/master/tomcat/CVE-2017-12615
# Port: 8080 (Tomcat)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tomcat-put
  labels:
    app.kubernetes.io/name: tomcat-put
    app.kubernetes.io/part-of: vulhub-targets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tomcat-put
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tomcat-put
    spec:
      containers:
        - name: tomcat
          image: vulhub/tomcat:8.5.19
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tomcat-put
  labels:
    app.kubernetes.io/name: tomcat-put
    app.kubernetes.io/part-of: vulhub-targets
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tomcat-put
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
