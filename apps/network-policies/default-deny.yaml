# Default Deny Network Policies
# =============================================================================
# These policies implement a zero-trust network model by denying all traffic
# by default. Specific allow rules are defined in per-namespace policy files.
#
# Apply these BEFORE namespace-specific policies to ensure default-deny.
# =============================================================================
---
# Faraday namespace - deny all ingress/egress by default
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: faraday
  labels:
    app.kubernetes.io/name: network-policy
    app.kubernetes.io/component: security
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
