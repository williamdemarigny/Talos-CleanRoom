apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  finalizers:
    - argoproj.io/resources-finalizer
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    targetRevision: 1.8.0
    chart: longhorn
    helm:
      # Skip Helm hooks to prevent ArgoCD sync loops with post-upgrade jobs
      skipCrds: false
      skipTests: true
      valuesObject:
        # Disable pre-upgrade checker to avoid ServiceAccount chicken-and-egg issue
        preUpgradeChecker:
          jobEnabled: false
        # Default settings
        defaultSettings:
          # Default replica count for volumes
          defaultReplicaCount: 2
          # Default data path on nodes
          defaultDataPath: /var/lib/longhorn
          # Storage over-provisioning percentage
          storageOverProvisioningPercentage: 200
          # Storage minimal available percentage
          storageMinimalAvailablePercentage: 15
          # Default data locality
          defaultDataLocality: best-effort
          # Replica soft anti-affinity
          replicaSoftAntiAffinity: true
          # Node down pod deletion policy
          nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
          # Guaranteed instance manager CPU
          guaranteedInstanceManagerCPU: 12
          # Auto cleanup system generated snapshot
          autoCleanupSystemGeneratedSnapshot: true
          # Auto delete pod when volume detached unexpectedly
          autoDeletePodWhenVolumeDetachedUnexpectedly: true

        # Persistence settings
        persistence:
          # Default storage class
          defaultClass: true
          defaultClassReplicaCount: 2
          defaultFsType: ext4
          reclaimPolicy: Delete

        # CSI settings
        csi:
          attacherReplicaCount: 2
          provisionerReplicaCount: 2
          resizerReplicaCount: 2
          snapshotterReplicaCount: 2

        # Longhorn Manager - runs on worker nodes only (no control-plane tolerations)
        longhornManager:
          priorityClass: longhorn-critical
          tolerations: []

        # Longhorn Driver - runs on worker nodes only (no control-plane tolerations)
        longhornDriver:
          priorityClass: longhorn-critical
          tolerations: []

        # Longhorn UI - runs on worker nodes only
        longhornUI:
          replicas: 1
          tolerations: []

        # Ingress for Longhorn UI (disabled by default)
        ingress:
          enabled: false
          host: longhorn.knowledgeondemand.net

        # Resources
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi

  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  ignoreDifferences:
    # Ignore Helm hook jobs completely - prevents sync loop
    - group: batch
      kind: Job
      name: longhorn-post-upgrade
      jqPathExpressions:
        - .spec
        - .status
        - .metadata
    # Ignore all CRD differences - Longhorn CRDs are managed by the operator and have runtime fields
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec
        - .metadata.annotations
        - .metadata.labels
    # Ignore webhook caBundle injected by cert-manager or other controllers
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[].clientConfig.caBundle
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/audit: privileged
        pod-security.kubernetes.io/warn: privileged
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
