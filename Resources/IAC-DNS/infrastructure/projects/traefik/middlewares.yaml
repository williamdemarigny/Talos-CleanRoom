# Traefik Middleware Configurations
# Apply AFTER Traefik is fully deployed
#
# These middlewares can be referenced in IngressRoute resources
# Example: middlewares:
#            - name: secure-headers
#              namespace: traefik
---
# Secure headers middleware - adds security headers to responses
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: secure-headers
  namespace: traefik
spec:
  headers:
    # Security headers
    frameDeny: true
    browserXssFilter: true
    contentTypeNosniff: true
    referrerPolicy: "strict-origin-when-cross-origin"
    # HSTS - be careful with this in development
    # stsSeconds: 31536000
    # stsIncludeSubdomains: true
    # stsPreload: true
    customFrameOptionsValue: "SAMEORIGIN"
---
# Rate limiting middleware - prevents abuse
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: traefik
spec:
  rateLimit:
    average: 100
    burst: 50
    period: 1m
---
# Compress middleware - enables gzip compression
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: traefik
spec:
  compress: {}
---
# Strip prefix middleware - useful for path-based routing
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: traefik
spec:
  stripPrefix:
    prefixes:
      - /api
---
# Redirect to HTTPS middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: traefik
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# Basic auth secret for UI access
# Default credentials: admin / admin (CHANGE IN PRODUCTION!)
# To regenerate: python -c "import hashlib; import base64; print('admin:' + '{SHA}' + base64.b64encode(hashlib.sha1(b'YOUR_PASSWORD'.encode()).digest()).decode())"
apiVersion: v1
kind: Secret
metadata:
  name: basic-auth-secret
  namespace: traefik
type: Opaque
stringData:
  users: "admin:{SHA}0DPiKuNIrrVmD8IUCuw1hQxNqZc="
---
# Basic auth middleware - references the secret above
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
  namespace: traefik
spec:
  basicAuth:
    secret: basic-auth-secret
    removeHeader: true
---
# Chain middleware - combines multiple middlewares
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: secured
  namespace: traefik
spec:
  chain:
    middlewares:
      - name: rate-limit
      - name: secure-headers
      - name: compress
