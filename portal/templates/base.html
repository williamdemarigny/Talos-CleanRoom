<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Talos CleanRoom Portal{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    {% if user %}
    <!-- Navigation -->
    <nav class="bg-gray-800 border-b border-gray-700">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-6">
                    <div class="flex-shrink-0">
                        <a href="/" class="text-xl font-bold text-cyan-400 hover:text-cyan-300">Talos CleanRoom</a>
                        <span class="text-sm text-gray-500 ml-2">Portal</span>
                    </div>
                    <a href="/" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium {% if page == 'home' %}bg-gray-900{% endif %}">Home</a>
                    <a href="/credentials" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium {% if page == 'credentials' %}bg-gray-900{% endif %}">Credentials</a>
                </div>
                <div class="flex items-center">
                    <span class="text-gray-400 mr-4">{{ user.username }}</span>
                    <button onclick="logout()" class="text-gray-300 hover:text-white px-3 py-2 rounded-md text-sm font-medium">
                        Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>
    {% endif %}

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
