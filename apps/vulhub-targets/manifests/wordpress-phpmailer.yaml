# Vulhub: WordPress PHPMailer RCE (CVE-2016-10033)
# Source: https://github.com/vulhub/vulhub/tree/master/wordpress/pwnscriptum
# Ports: 80 (WordPress), 3306 (MySQL — internal only)
# Multi-container pod: MySQL and WordPress start together.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-phpmailer
  labels:
    app.kubernetes.io/name: wordpress-phpmailer
    app.kubernetes.io/part-of: vulhub-targets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress-phpmailer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress-phpmailer
    spec:
      containers:
        - name: mysql
          image: mysql:5.7
          ports:
            - containerPort: 3306
              protocol: TCP
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "root"
            - name: MYSQL_DATABASE
              value: "wordpress"
            - name: MYSQL_USER
              value: "wordpress"
            - name: MYSQL_PASSWORD
              value: "wordpress"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - "127.0.0.1"
                - -u
                - root
                - -proot
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - "127.0.0.1"
                - -u
                - root
                - -proot
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
        - name: wordpress
          image: vulhub/wordpress:4.6
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: WORDPRESS_DB_HOST
              value: "127.0.0.1"
            - name: WORDPRESS_DB_NAME
              value: "wordpress"
            - name: WORDPRESS_DB_USER
              value: "wordpress"
            - name: WORDPRESS_DB_PASSWORD
              value: "wordpress"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress-phpmailer
  labels:
    app.kubernetes.io/name: wordpress-phpmailer
    app.kubernetes.io/part-of: vulhub-targets
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wordpress-phpmailer
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
