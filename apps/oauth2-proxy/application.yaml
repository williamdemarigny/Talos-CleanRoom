apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oauth2-proxy
  namespace: argocd
  finalizers:
    - argoproj.io/resources-finalizer
  annotations:
    # Wave 3: AFTER Keycloak (wave 2) so the IdP is ready
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://oauth2-proxy.github.io/manifests
    chart: oauth2-proxy
    targetRevision: 7.12.0
    helm:
      valuesObject:
        config:
          clientID: traefik-forward-auth
          # Client secret injected from existing secret
          existingSecret: oauth2-proxy-credentials
          cookieSecret: ""  # From secret

        extraArgs:
          provider: oidc
          oidc-issuer-url: https://keycloak.knowledgeondemand.net/realms/cleanroom
          cookie-domain: .knowledgeondemand.net
          whitelist-domain: .knowledgeondemand.net
          email-domain: "*"
          pass-access-token: "true"
          set-xauthrequest: "true"
          cookie-secure: "true"
          cookie-samesite: lax
          skip-provider-button: "true"
          upstream: static://200

        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi

        replicaCount: 1

  destination:
    server: https://kubernetes.default.svc
    namespace: oauth2-proxy
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/warn: restricted
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
