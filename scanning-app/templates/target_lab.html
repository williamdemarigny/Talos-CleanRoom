{% extends "base.html" %}
{% block title %}Target Lab — Talos CleanRoom{% endblock %}
{% block content %}
<div x-data="targetLabManager()" x-init="init()">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-white">Target Lab</h1>
            <p class="text-gray-400 mt-1">Deploy intentionally vulnerable VMs for scan testing and validation</p>
        </div>
        <div x-show="enabled" class="text-sm">
            <span class="text-gray-400">Capacity:</span>
            <span :class="capacity.available > 0 ? 'text-green-400' : 'text-red-400'"
                  x-text="capacity.used + '/' + capacity.max + ' slots used'"></span>
        </div>
    </div>

    <!-- Auto-deploy banner -->
    <template x-if="autoDeploying">
        <div class="bg-cyan-900/30 border border-cyan-600 rounded-lg p-4 mb-6">
            <div class="flex items-center">
                <svg class="animate-spin h-5 w-5 text-cyan-400 mr-3" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                <div>
                    <h3 class="text-cyan-400 font-medium">Preparing Target VM</h3>
                    <p class="text-gray-300 text-sm mt-1">
                        Automatically deploying an Ubuntu 14.04 target VM for scanning. This takes 2-3 minutes.
                    </p>
                </div>
            </div>
        </div>
    </template>

    <!-- Not configured warning -->
    <template x-if="!enabled">
        <div class="bg-yellow-900/30 border border-yellow-600 rounded-lg p-4 mb-6">
            <h3 class="text-yellow-400 font-medium">Target Lab Not Configured</h3>
            <p class="text-gray-300 text-sm mt-1">
                Set <code class="text-cyan-400">PROXMOX_API_URL</code> and <code class="text-cyan-400">PROXMOX_API_TOKEN</code>
                environment variables to enable target VM deployment.
            </p>
        </div>
    </template>

    <!-- Template Cards -->
    <template x-if="enabled">
        <div>
            <h2 class="text-lg font-medium text-white mb-4">Available Templates</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <template x-for="tmpl in templates" :key="tmpl.type">
                    <div class="bg-gray-800 border border-gray-700 rounded-lg p-6 hover:border-gray-600 transition-colors">
                        <!-- Template header -->
                        <div class="flex items-start justify-between mb-3">
                            <div>
                                <h3 class="text-lg font-semibold text-white" x-text="tmpl.name"></h3>
                                <span class="text-xs px-2 py-0.5 rounded-full mt-1 inline-block"
                                      :class="tmpl.type === 'ubuntu' ? 'bg-orange-900/50 text-orange-400' : 'bg-blue-900/50 text-blue-400'"
                                      x-text="tmpl.os"></span>
                            </div>
                            <div class="text-right text-xs text-gray-500">
                                <div x-text="tmpl.specs.cpu + ' CPU / ' + (tmpl.specs.memory_mb / 1024) + ' GB RAM'"></div>
                                <div x-text="tmpl.specs.disk_gb + ' GB disk'"></div>
                            </div>
                        </div>

                        <!-- Description -->
                        <p class="text-gray-400 text-sm mb-3" x-text="tmpl.description"></p>

                        <!-- Services list -->
                        <div class="mb-4">
                            <p class="text-xs text-gray-500 mb-1">Vulnerable services:</p>
                            <div class="flex flex-wrap gap-1">
                                <template x-for="svc in tmpl.services" :key="svc">
                                    <span class="text-xs bg-gray-700 text-gray-300 px-2 py-0.5 rounded" x-text="svc"></span>
                                </template>
                            </div>
                        </div>

                        <!-- Credentials -->
                        <p class="text-xs text-gray-500 mb-4">
                            Credentials: <span class="text-cyan-400 font-mono" x-text="tmpl.credentials"></span>
                        </p>

                        <!-- Deploy button -->
                        <button @click="deploy(tmpl.type)"
                                :disabled="deploying || capacity.available <= 0"
                                class="w-full py-2 px-4 rounded-md text-sm font-medium transition-colors
                                       bg-cyan-600 hover:bg-cyan-500 text-white
                                       disabled:opacity-50 disabled:cursor-not-allowed">
                            <span x-show="!isDeploying(tmpl.type)">Deploy</span>
                            <span x-show="isDeploying(tmpl.type)" class="flex items-center justify-center">
                                <svg class="animate-spin h-4 w-4 mr-2" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                                </svg>
                                Deploying...
                            </span>
                        </button>

                        <!-- Windows limit note -->
                        <template x-if="tmpl.max_instances === 1">
                            <p class="text-xs text-gray-500 mt-2 text-center">Limited to 1 concurrent instance</p>
                        </template>
                    </div>
                </template>
            </div>

            <!-- Active Target VMs -->
            <h2 class="text-lg font-medium text-white mb-4">Active Target VMs</h2>
            <template x-if="targets.length === 0">
                <div class="bg-gray-800 border border-gray-700 rounded-lg p-8 text-center">
                    <p class="text-gray-400">No target VMs deployed.</p>
                    <p class="text-gray-500 text-sm mt-1">Deploy a template above to get started.</p>
                </div>
            </template>

            <template x-if="targets.length > 0">
                <div class="bg-gray-800 border border-gray-700 rounded-lg overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-gray-750">
                            <tr class="border-b border-gray-700">
                                <th class="text-left text-xs text-gray-400 font-medium px-4 py-3">Name</th>
                                <th class="text-left text-xs text-gray-400 font-medium px-4 py-3">Type</th>
                                <th class="text-left text-xs text-gray-400 font-medium px-4 py-3">IP Address</th>
                                <th class="text-left text-xs text-gray-400 font-medium px-4 py-3">Status</th>
                                <th class="text-left text-xs text-gray-400 font-medium px-4 py-3">TTL Remaining</th>
                                <th class="text-left text-xs text-gray-400 font-medium px-4 py-3">Node</th>
                                <th class="text-right text-xs text-gray-400 font-medium px-4 py-3">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="vm in targets" :key="vm.vmid">
                                <tr class="border-b border-gray-700/50 hover:bg-gray-700/30">
                                    <td class="px-4 py-3">
                                        <span class="text-white font-mono text-sm" x-text="vm.name"></span>
                                    </td>
                                    <td class="px-4 py-3">
                                        <span class="text-xs px-2 py-0.5 rounded-full"
                                              :class="vm.template_type === 'ubuntu' ? 'bg-orange-900/50 text-orange-400' : 'bg-blue-900/50 text-blue-400'"
                                              x-text="vm.template_type"></span>
                                    </td>
                                    <td class="px-4 py-3">
                                        <span class="text-cyan-400 font-mono text-sm" x-text="vm.ip_address"></span>
                                    </td>
                                    <td class="px-4 py-3">
                                        <span class="text-xs px-2 py-0.5 rounded-full"
                                              :class="statusClass(vm.status)"
                                              x-text="vm.status"></span>
                                    </td>
                                    <td class="px-4 py-3">
                                        <span class="text-sm" :class="vm.ttl_remaining_seconds < 1800 ? 'text-yellow-400' : 'text-gray-300'"
                                              x-text="formatTTL(vm.ttl_remaining_seconds)"></span>
                                    </td>
                                    <td class="px-4 py-3">
                                        <span class="text-gray-400 text-sm" x-text="vm.proxmox_node"></span>
                                    </td>
                                    <td class="px-4 py-3 text-right space-x-2">
                                        <button x-show="vm.status === 'running'"
                                                @click="scanTarget(vm.ip_address)"
                                                class="text-xs bg-green-600 hover:bg-green-500 text-white px-3 py-1 rounded transition-colors">
                                            Scan This Target
                                        </button>
                                        <button x-show="vm.status === 'running'"
                                                @click="extendTTL(vm.vmid)"
                                                class="text-xs bg-gray-600 hover:bg-gray-500 text-white px-3 py-1 rounded transition-colors"
                                                title="Extend TTL by 4 hours">
                                            +4h
                                        </button>
                                        <button @click="confirmDestroy(vm.vmid, vm.name)"
                                                :disabled="vm.status === 'stopping'"
                                                class="text-xs bg-red-600 hover:bg-red-500 text-white px-3 py-1 rounded transition-colors disabled:opacity-50">
                                            Destroy
                                        </button>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>

            <!-- Error display -->
            <template x-if="targets.some(t => t.status === 'error')">
                <div class="mt-4">
                    <template x-for="vm in targets.filter(t => t.status === 'error')" :key="vm.vmid">
                        <div class="bg-red-900/30 border border-red-600 rounded-lg p-3 mb-2">
                            <span class="text-red-400 font-medium" x-text="vm.name + ':'"></span>
                            <span class="text-gray-300 text-sm ml-2" x-text="vm.error_message || 'Unknown error'"></span>
                        </div>
                    </template>
                </div>
            </template>
        </div>
    </template>

    <!-- Error toast -->
    <div x-show="error" x-transition
         class="fixed bottom-4 right-4 bg-red-900/90 border border-red-600 text-white px-4 py-3 rounded-lg shadow-lg max-w-md">
        <div class="flex items-start">
            <span class="text-red-400 mr-2">Error:</span>
            <span class="text-sm" x-text="error"></span>
            <button @click="error = ''" class="ml-4 text-gray-400 hover:text-white">&times;</button>
        </div>
    </div>
</div>

<script src="/static/js/app.js"></script>
<script src="/static/js/target_lab.js"></script>
{% endblock %}
