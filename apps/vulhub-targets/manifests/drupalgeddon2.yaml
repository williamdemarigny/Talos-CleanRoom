# Vulhub: Drupalgeddon 2 (CVE-2018-7600) — Drupal remote code execution
# Source: https://github.com/vulhub/vulhub/tree/master/drupal/CVE-2018-7600
# Ports: 80 (Drupal), 3306 (MySQL — internal only)
# Multi-container pod: MySQL and Drupal start together.  Drupal's readiness
# probe has a generous delay and failure threshold so it waits for MySQL
# to become available before the pod is marked Ready.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drupalgeddon2
  labels:
    app.kubernetes.io/name: drupalgeddon2
    app.kubernetes.io/part-of: vulhub-targets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: drupalgeddon2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drupalgeddon2
    spec:
      containers:
        - name: mysql
          image: mysql:5.7
          ports:
            - containerPort: 3306
              protocol: TCP
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "root"
            - name: MYSQL_DATABASE
              value: "drupal"
            - name: MYSQL_USER
              value: "drupal"
            - name: MYSQL_PASSWORD
              value: "drupal"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - "127.0.0.1"
                - -u
                - root
                - -proot
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - -h
                - "127.0.0.1"
                - -u
                - root
                - -proot
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
        - name: drupal
          image: vulhub/drupal:8.5.0
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: DRUPAL_DB_HOST
              value: "127.0.0.1"
            - name: DRUPAL_DB_NAME
              value: "drupal"
            - name: DRUPAL_DB_USER
              value: "drupal"
            - name: DRUPAL_DB_PASSWORD
              value: "drupal"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: drupalgeddon2
  labels:
    app.kubernetes.io/name: drupalgeddon2
    app.kubernetes.io/part-of: vulhub-targets
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: drupalgeddon2
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
