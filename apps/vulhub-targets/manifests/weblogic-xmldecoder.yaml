# Vulhub: WebLogic XMLDecoder RCE (CVE-2017-10271)
# Source: https://github.com/vulhub/vulhub/tree/master/weblogic/CVE-2017-10271
# Port: 7001 (WebLogic console)
# Note: WebLogic is slow to start — generous probe delays.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weblogic-xmldecoder
  labels:
    app.kubernetes.io/name: weblogic-xmldecoder
    app.kubernetes.io/part-of: vulhub-targets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: weblogic-xmldecoder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: weblogic-xmldecoder
    spec:
      containers:
        - name: weblogic
          image: vulhub/weblogic:10.3.6.0-2017
          ports:
            - containerPort: 7001
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 7001
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 7001
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: weblogic-xmldecoder
  labels:
    app.kubernetes.io/name: weblogic-xmldecoder
    app.kubernetes.io/part-of: vulhub-targets
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: weblogic-xmldecoder
  ports:
    - port: 7001
      targetPort: 7001
      protocol: TCP
      name: weblogic
