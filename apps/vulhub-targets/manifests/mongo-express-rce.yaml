# Vulhub: mongo-express RCE (CVE-2019-10758)
# Source: https://github.com/vulhub/vulhub/tree/master/mongo-express/CVE-2019-10758
# Ports: 8081 (mongo-express web UI), 27017 (MongoDB — internal only)
# Multi-container pod: MongoDB and mongo-express start together.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express-rce
  labels:
    app.kubernetes.io/name: mongo-express-rce
    app.kubernetes.io/part-of: vulhub-targets
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongo-express-rce
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo-express-rce
    spec:
      containers:
        - name: mongodb
          image: mongo:3.6
          ports:
            - containerPort: 27017
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
        - name: mongo-express
          image: vulhub/mongo-express:0.54.0
          ports:
            - containerPort: 8081
              protocol: TCP
          env:
            - name: ME_CONFIG_MONGODB_SERVER
              value: "127.0.0.1"
            - name: ME_CONFIG_MONGODB_PORT
              value: "27017"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express-rce
  labels:
    app.kubernetes.io/name: mongo-express-rce
    app.kubernetes.io/part-of: vulhub-targets
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mongo-express-rce
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
