# Traefik Middleware Configurations
# Apply AFTER Traefik is fully deployed
#
# These middlewares can be referenced in IngressRoute resources
# Example: middlewares:
#            - name: secure-headers
#              namespace: traefik
---
# Secure headers middleware - adds security headers to responses
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: secure-headers
  namespace: traefik
spec:
  headers:
    # Security headers
    frameDeny: true
    browserXssFilter: true
    contentTypeNosniff: true
    referrerPolicy: "strict-origin-when-cross-origin"
    # HSTS - be careful with this in development
    # stsSeconds: 31536000
    # stsIncludeSubdomains: true
    # stsPreload: true
    customFrameOptionsValue: "SAMEORIGIN"
---
# Rate limiting middleware - prevents abuse
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: traefik
spec:
  rateLimit:
    average: 100
    burst: 50
    period: 1m
---
# Compress middleware - enables gzip compression
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: compress
  namespace: traefik
spec:
  compress: {}
---
# Strip prefix middleware - useful for path-based routing
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api-prefix
  namespace: traefik
spec:
  stripPrefix:
    prefixes:
      - /api
---
# Redirect to HTTPS middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: traefik
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# =============================================================================
# BASIC AUTH SECRET - Managed externally via SOPS encryption
# =============================================================================
# The basic-auth-secret is stored in:
#   basic-auth-secret.sops.yaml (SOPS-encrypted)
#
# To generate new credentials:
#   ../../../scripts/generate-secrets.sh
#
# To apply secret (decrypts and applies):
#   sops -d basic-auth-secret.sops.yaml | kubectl apply -f -
#
# The secret must contain a 'users' key with htpasswd-formatted entries:
#   users: "admin:{SHA}base64hash"
# =============================================================================
---
# Basic auth middleware - references the basic-auth-secret
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: basic-auth
  namespace: traefik
spec:
  basicAuth:
    secret: basic-auth-secret
    removeHeader: true
---
# Keycloak ForwardAuth middleware — delegates authentication to OAuth2-Proxy
# which validates against Keycloak OIDC. Used for services without native OIDC
# support (Faraday, OpenVAS, Threat Dragon).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-forward-auth
  namespace: traefik
spec:
  forwardAuth:
    address: http://oauth2-proxy.oauth2-proxy.svc.cluster.local:4180/oauth2/auth
    trustForwardHeader: true
    authResponseHeaders:
      - X-Auth-Request-User
      - X-Auth-Request-Email
      - X-Auth-Request-Access-Token
---
# Chain middleware - combines multiple middlewares
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: secured
  namespace: traefik
spec:
  chain:
    middlewares:
      - name: rate-limit
      - name: secure-headers
      - name: compress
