[project]
name = "talos-common"
version = "0.1.0"
description = "Shared library for Talos CleanRoom applications"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "PyJWT>=2.8.0",
    "httpx>=0.27.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "websockets>=12.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["talos_common*"]

[tool.setuptools.package-data]
talos_common = ["static/**/*", "templates/**/*"]
