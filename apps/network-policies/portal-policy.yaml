# Portal Network Policy
# =============================================================================
# Portal is a lightweight landing page that only needs:
# - Ingress from Traefik (web UI access)
# - Egress to DNS (name resolution)
# - Egress to Keycloak (OIDC token exchange, JWKS validation)
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-portal-traffic
  namespace: portal
  labels:
    app.kubernetes.io/name: portal
    app.kubernetes.io/component: network-policy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: portal
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from Traefik namespace (web UI access)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow connection to Keycloak (OIDC token exchange, JWKS validation)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
      ports:
        - protocol: TCP
          port: 8080
