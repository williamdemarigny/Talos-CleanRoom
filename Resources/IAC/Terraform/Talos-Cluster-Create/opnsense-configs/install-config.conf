#!/bin/sh
#
# OPNSense Automated Installation Configuration
# This script automates the OPNSense installation process
#

# Installation type: ufs or zfs
INSTALL_TYPE="ufs"

# Disk to install to (usually da0 or ada0)
INSTALL_DISK="da0"

# Root password (change this!)
ROOT_PASSWORD="opnsense"

# Keyboard layout
KEYBOARD_LAYOUT="us.kbd"

# Network configuration
# WAN interface (first interface, typically vtnet0)
WAN_INTERFACE="vtnet0"
WAN_TYPE="static"
WAN_IP="10.83.3.5"
WAN_SUBNET="24"
WAN_GATEWAY="10.83.3.1"

# LAN interface (if you have a second interface)
# LAN_INTERFACE="vtnet1"
# LAN_IP="192.168.1.1"
# LAN_SUBNET="24"

# DNS servers
DNS_PRIMARY="8.8.8.8"
DNS_SECONDARY="8.8.4.4"

# Hostname
HOSTNAME="opnsense-fw-01"
DOMAIN="local"

# Timezone
TIMEZONE="America/New_York"

# Enable SSH
ENABLE_SSH="YES"

# Auto-reboot after installation
AUTO_REBOOT="YES"
