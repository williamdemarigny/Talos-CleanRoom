# Nmap Scanner Network Policy
# =============================================================================
# Ephemeral Nmap scanner pods need:
# - Ingress from scanning-console namespace (kubectl exec orchestration)
# - Egress to scan targets (unrestricted — Nmap needs arbitrary port access)
# - Egress to DNS (name resolution)
# =============================================================================
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nmap-scanner-traffic
  namespace: nmap-scanner
  labels:
    app.kubernetes.io/name: nmap-scanner
    app.kubernetes.io/component: network-policy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from scanning-console namespace (kubectl exec/logs)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: scanning-console
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow all egress to scan targets (Nmap needs arbitrary port access)
    # Restricted to external targets only (not cluster-internal)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.15.0.0/16  # K8s Service CIDR
              - 10.14.0.0/16  # K8s Pod CIDR
