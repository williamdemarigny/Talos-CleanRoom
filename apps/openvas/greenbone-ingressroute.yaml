# OpenVAS/Greenbone IngressRoute
# Access via: https://openvas.knowledgeondemand.net
#
# TLS: Uses wildcard certificate from default TLSStore
# Auth: Keycloak via OAuth2-Proxy ForwardAuth
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: greenbone-gsa
  namespace: openvas
spec:
  entryPoints:
    - websecure
  routes:
    # OAuth2-Proxy sign-in/callback routes (must be BEFORE the catch-all)
    - match: Host(`openvas.knowledgeondemand.net`) && PathPrefix(`/oauth2/`)
      kind: Rule
      services:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
    # Main application route with ForwardAuth
    - match: Host(`openvas.knowledgeondemand.net`)
      kind: Rule
      services:
        - name: greenbone
          port: 80
      middlewares:
        - name: keycloak-forward-auth
          namespace: traefik
        - name: oauth2-errors
          namespace: traefik
        - name: secure-headers
          namespace: traefik
  tls: {}
  # Uses default TLSStore with knowledgeondemand-wildcard-tls certificate
