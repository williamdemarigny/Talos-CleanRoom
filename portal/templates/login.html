<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Talos CleanRoom {{ app_subtitle }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.14.9/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md" x-data="loginForm()">
        <div class="bg-gray-800 rounded-lg shadow-xl p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-cyan-400">Talos CleanRoom</h1>
                <p class="text-gray-400 mt-2">{{ app_subtitle }}</p>
            </div>

            {% if oidc_enabled | default(false) %}
            <div class="mb-6">
                <a href="/auth/login"
                   class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                    Sign in with Keycloak SSO
                </a>
                <div class="mt-4 flex items-center">
                    <div class="flex-grow border-t border-gray-700"></div>
                    <span class="mx-4 text-sm text-gray-500">or use local credentials</span>
                    <div class="flex-grow border-t border-gray-700"></div>
                </div>
            </div>
            {% endif %}

            <form @submit.prevent="login">
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Username</label>
                    <input type="text" x-model="username" required autofocus
                           class="w-full bg-gray-700 text-white border border-gray-600 rounded-md px-4 py-2 focus:ring-2 focus:ring-cyan-500 focus:border-transparent placeholder-gray-500"
                           placeholder="Enter username">
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                    <input type="password" x-model="password" required
                           class="w-full bg-gray-700 text-white border border-gray-600 rounded-md px-4 py-2 focus:ring-2 focus:ring-cyan-500 focus:border-transparent placeholder-gray-500"
                           placeholder="Enter password">
                </div>

                <div x-show="error" class="mb-4 p-3 bg-red-900/50 border border-red-500 rounded text-red-200 text-sm" x-text="error"></div>

                <button type="submit" :disabled="loading"
                        class="w-full bg-cyan-600 text-white py-2 px-4 rounded-md hover:bg-cyan-700 font-medium disabled:opacity-50">
                    <span x-show="!loading">Sign In</span>
                    <span x-show="loading">Signing in...</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        function loginForm() {
            return {
                username: '',
                password: '',
                error: '',
                loading: false,

                async login() {
                    this.error = '';
                    this.loading = true;

                    try {
                        const response = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: this.username,
                                password: this.password
                            })
                        });

                        if (response.ok) {
                            const data = await response.json();
                            localStorage.setItem('access_token', data.access_token);
                            window.location.href = '/';
                        } else {
                            const error = await response.json();
                            this.error = error.detail || 'Login failed';
                        }
                    } catch (e) {
                        this.error = 'Connection error. Please try again.';
                    } finally {
                        this.loading = false;
                    }
                }
            };
        }
    </script>
</body>
</html>
