# CleanRoom Database - PostgreSQL 17
# Shared database for scanning-console (scan results, audit logs)
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cleanroom-db
  namespace: cleanroom-db
  labels:
    app.kubernetes.io/name: cleanroom-db
    app.kubernetes.io/component: database
spec:
  serviceName: cleanroom-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cleanroom-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cleanroom-db
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: security-platform
    spec:
      # ============================================================
      # INIT CONTAINERS
      # ============================================================
      initContainers:
      - name: init-pgdata
        image: postgres:17-alpine
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "Setting up PostgreSQL data directory..."
            # Ensure the PGDATA subdirectory exists with correct ownership
            mkdir -p /var/lib/postgresql/data/pgdata
            chown -R postgres:postgres /var/lib/postgresql/data
            chmod 700 /var/lib/postgresql/data/pgdata
            echo "PostgreSQL data directory ready."
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        securityContext:
          runAsUser: 0
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"

      # ============================================================
      # MAIN CONTAINERS
      # ============================================================
      containers:
      - name: postgres
        image: postgres:17-alpine
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: POSTGRES_USER
          value: "cleanroom"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: cleanroom-db-credentials
              key: postgres-password
        - name: POSTGRES_DB
          value: "cleanroom"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: backup-data
          mountPath: /backups
        ports:
        - containerPort: 5432
          name: postgres
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        # Startup: 5s interval × 30 failures = 2.5min max
        startupProbe:
          exec:
            command: ["pg_isready", "-U", "cleanroom", "-d", "cleanroom"]
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "cleanroom", "-d", "cleanroom"]
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "cleanroom", "-d", "cleanroom"]
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3

      # ============================================================
      # VOLUMES
      # ============================================================
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: cleanroom-db-data
      - name: backup-data
        persistentVolumeClaim:
          claimName: cleanroom-db-backup
