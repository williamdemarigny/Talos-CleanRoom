# Faraday - Vulnerability Management Platform
# Web-based security platform that integrates with Metasploit, Nmap, and 80+ tools
#
# Architecture:
# - PostgreSQL container: Database backend
# - Redis container: Cache and message broker
# - Faraday Server: Web UI and API
#
# Default credentials: faraday / admin (change in production!)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: faraday
  namespace: faraday
  labels:
    app.kubernetes.io/name: faraday
    app.kubernetes.io/component: security-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: faraday
  template:
    metadata:
      labels:
        app: faraday
    spec:
      # ============================================================
      # INIT CONTAINERS
      # ============================================================
      initContainers:
      - name: init-postgres
        image: postgres:15-alpine
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            echo "Setting up PostgreSQL data directory..."
            if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
              echo "Initializing PostgreSQL database..."
              chown -R postgres:postgres /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data
            else
              echo "PostgreSQL data directory already initialized."
            fi
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        securityContext:
          runAsUser: 0
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"

      # ============================================================
      # MAIN CONTAINERS
      # ============================================================
      containers:
      # 1. PostgreSQL Database
      - name: postgres
        image: postgres:15-alpine
        env:
        - name: POSTGRES_USER
          value: "faraday"
        - name: POSTGRES_PASSWORD
          value: "admin"
        - name: POSTGRES_DB
          value: "faraday"
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        ports:
        - containerPort: 5432
          name: postgres
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "faraday", "-d", "faraday"]
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "faraday", "-d", "faraday"]
          initialDelaySeconds: 30
          periodSeconds: 30

      # 2. Redis Cache
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 10
          periodSeconds: 10

      # 3. Faraday Server
      - name: faraday
        image: faradaysec/faraday:5.6.1
        command: ["/bin/bash", "-c"]
        args:
          - |
            echo "Waiting for PostgreSQL on port 5432..."
            while ! (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null; do
              echo "PostgreSQL not ready, waiting..."
              sleep 2
            done
            echo "PostgreSQL ready."

            echo "Waiting for Redis on port 6379..."
            while ! (echo > /dev/tcp/127.0.0.1/6379) 2>/dev/null; do
              echo "Redis not ready, waiting..."
              sleep 2
            done
            echo "Redis ready."

            # Start Faraday
            exec /entrypoint.sh
        env:
        - name: PGSQL_HOST
          value: "127.0.0.1"
        - name: PGSQL_PORT
          value: "5432"
        - name: PGSQL_USER
          value: "faraday"
        - name: PGSQL_PASSWD
          value: "admin"
        - name: PGSQL_DBNAME
          value: "faraday"
        - name: REDIS_SERVER
          value: "redis://127.0.0.1:6379"
        volumeMounts:
        - name: faraday-data
          mountPath: /home/faraday/.faraday
        ports:
        - containerPort: 5985
          name: http
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "4Gi"
            cpu: "1"
        startupProbe:
          tcpSocket:
            port: 5985
          initialDelaySeconds: 30
          periodSeconds: 10
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: 5985
          initialDelaySeconds: 90
          periodSeconds: 10
          failureThreshold: 15
        livenessProbe:
          tcpSocket:
            port: 5985
          initialDelaySeconds: 180
          periodSeconds: 30
          failureThreshold: 10

      # ============================================================
      # VOLUMES
      # ============================================================
      volumes:
      - name: faraday-data
        persistentVolumeClaim:
          claimName: faraday-data
      - name: postgres-data
        persistentVolumeClaim:
          claimName: faraday-db
---
# Database credentials secret (kept for reference, values now inline)
apiVersion: v1
kind: Secret
metadata:
  name: faraday-db-credentials
  namespace: faraday
  labels:
    app.kubernetes.io/name: faraday
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  password: "admin"
---
# Admin credentials secret
apiVersion: v1
kind: Secret
metadata:
  name: faraday-admin-credentials
  namespace: faraday
  labels:
    app.kubernetes.io/name: faraday
    app.kubernetes.io/component: credentials
type: Opaque
stringData:
  password: "admin"
