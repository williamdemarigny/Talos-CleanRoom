# Faraday IngressRoute
# Access via: https://faraday.knowledgeondemand.net
#
# TLS: Uses wildcard certificate from default TLSStore
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: faraday
  namespace: faraday
spec:
  entryPoints:
    - websecure
  routes:
    # OAuth2-Proxy sign-in/callback routes (must be BEFORE the catch-all)
    - match: Host(`faraday.knowledgeondemand.net`) && PathPrefix(`/oauth2/`)
      kind: Rule
      services:
        - name: oauth2-proxy
          namespace: oauth2-proxy
          port: 80
    # Main application route with ForwardAuth
    - match: Host(`faraday.knowledgeondemand.net`)
      kind: Rule
      services:
        - name: faraday
          port: 5985
      middlewares:
        - name: keycloak-forward-auth
          namespace: traefik
        - name: oauth2-errors
          namespace: traefik
        - name: secure-headers
          namespace: traefik
  tls: {}
  # Uses default TLSStore with knowledgeondemand-wildcard-tls certificate
