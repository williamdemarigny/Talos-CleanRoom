# OpenVAS/Greenbone IngressRoute
# Access via: https://openvas.knowledgeondemand.net
#
# TLS: Uses wildcard certificate from default TLSStore
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: greenbone-gsa
  namespace: openvas
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`openvas.knowledgeondemand.net`)
      kind: Rule
      services:
        - name: greenbone
          port: 80
      middlewares:
        - name: keycloak-forward-auth
          namespace: traefik
        - name: secure-headers
          namespace: traefik
  tls: {}
  # Uses default TLSStore with knowledgeondemand-wildcard-tls certificate
